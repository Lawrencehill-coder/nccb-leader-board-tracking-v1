<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NCCB Sales Team Command Center</title>
<style>
:root{--nav:#071b35;--blue:#1764c0;--green:#178447;--red:#c91e28;--orange:#ed7300;--purple:#6844a5;--ink:#142033;--muted:#68758a;--line:#dce3eb;--bg:#f3f6fa;--card:#fff;--shadow:0 8px 24px rgba(16,38,68,.08)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.login-page{min-height:100vh;display:grid;place-items:center;background:#fbf6f1;padding:20px}.login-card{width:min(430px,94vw);background:#fff;border:2px solid var(--orange);border-radius:11px;padding:28px 24px 32px}.login-logo{display:block;width:130px;margin:0 auto 22px}.login-card h1{font-size:19px;color:#b55700;text-align:center;margin:0 0 14px}.login-card label{display:block;font-size:13px;color:#677180;margin:12px 0 5px}.login-card input,.login-card select{width:100%;height:38px;border:1px solid #d4d9df;border-radius:5px;padding:0 10px}.login-btn{display:block;margin:16px auto 0;border:0;background:var(--orange);color:#fff;border-radius:5px;padding:9px 18px}.login-msg{min-height:18px;margin-top:10px;color:var(--red);font-size:12px;text-align:center}
.sidebar{position:fixed;inset:0 auto 0 0;width:225px;background:linear-gradient(180deg,#071b35,#06152a);color:#fff;display:flex;flex-direction:column;z-index:20}.brand{padding:18px;border-bottom:1px solid rgba(255,255,255,.09)}.brand img{width:88px;background:#fff;border-radius:5px;padding:3px}.brand b{display:block;margin-top:8px;font-size:12px}.nav{padding:12px 8px;display:grid;gap:3px}.nav button{border:0;background:transparent;color:#dce7f4;border-radius:7px;padding:10px 11px;text-align:left;font-weight:700}.nav button.active,.nav button:hover{background:#0b66c8;color:#fff}.userbox{margin-top:auto;padding:14px;border-top:1px solid rgba(255,255,255,.1);font-size:12px}.userbox small{display:block;color:#a9bbcf;margin:4px 0 10px}
.main{margin-left:225px;min-height:100vh}.topbar{position:sticky;top:0;z-index:15;background:#fff;border-bottom:1px solid var(--line);padding:11px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}.topbar h1{margin:0;font-size:20px}.topbar p{margin:3px 0 0;font-size:11px;color:var(--muted)}.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.top-actions input{border:1px solid var(--line);border-radius:6px;padding:8px}.badge{padding:6px 8px;border-radius:99px;background:#e8f7ef;color:#166a3b;font-size:10px;font-weight:900}.content{padding:16px 18px 30px}
.btn{border:0;border-radius:6px;padding:9px 12px;font-weight:800}.primary{background:var(--blue);color:#fff}.green{background:var(--green);color:#fff}.red{background:var(--red);color:#fff}.ghost{background:#fff;border:1px solid var(--line)}.small{padding:6px 8px;font-size:11px}
.card{background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);overflow:hidden}.card-head{padding:12px 14px;color:#fff;font-weight:900}.card-body{padding:14px}.blueh{background:var(--blue)}.greenh{background:var(--green)}.redh{background:var(--red)}.orangeh{background:var(--orange)}.purpleh{background:var(--purple)}.grayh{background:#596779}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.kpi{background:#fff;border:1px solid var(--line);border-radius:8px;padding:13px;box-shadow:var(--shadow)}.kpi small{font-size:9px;color:var(--muted);text-transform:uppercase;font-weight:900}.kpi b{display:block;font-size:25px;margin-top:5px}.progress{height:8px;background:#e9edf3;border-radius:99px;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;background:var(--green)}.tiny{font-size:10px;color:var(--muted)}.section-title{margin:0 0 6px;font-size:20px}.subhead{font-size:12px;color:var(--muted);margin:0 0 12px}
.table-wrap{overflow:auto}table.data{width:100%;border-collapse:collapse}table.data th,table.data td{padding:8px;border-bottom:1px solid var(--line);font-size:11px;text-align:left;white-space:nowrap}table.data th{font-size:9px;text-transform:uppercase;color:var(--muted);background:#f8fafc}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:12px}.toolbar label{font-size:10px;font-weight:900;color:#5e6c80}.toolbar input,.toolbar select{display:block;margin-top:4px;border:1px solid var(--line);border-radius:6px;padding:8px;background:#fff}.form{display:grid;gap:10px}.form label{font-size:10px;font-weight:900;color:#5e6c80}.form input,.form select,.form textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:9px}.four{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tabs button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:8px 10px;font-size:11px;font-weight:800}.tabs button.active{background:var(--blue);color:#fff}
.chart{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px}.chart-title{font-size:11px;font-weight:900;color:#44536a;margin-bottom:8px}.bar-row{display:grid;grid-template-columns:140px 1fr 45px;gap:8px;align-items:center;font-size:10px;margin:7px 0}.bar-track{height:12px;background:#edf1f6;border-radius:99px;overflow:hidden}.bar-fill{height:100%;background:var(--blue)}.bar-fill.proj{background:var(--orange)}
.note{padding:10px;border-radius:6px;background:#f6f8fb;color:#627084;font-size:11px;line-height:1.45}.stop{color:var(--red);font-weight:900}
.invoice,.report-paper{background:#fff;border:1px solid var(--line);border-radius:8px;padding:18px}.doc-head{display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid #153b70;padding-bottom:12px;margin-bottom:12px}.doc-head img{width:115px}.doc-head h2{margin:0;color:#153b70}.doc-meta{font-size:11px;color:var(--muted);text-align:right}.invoice table{width:100%;border-collapse:collapse}.invoice th,.invoice td{padding:9px;border-bottom:1px solid var(--line);font-size:11px;text-align:right}.invoice th:first-child,.invoice td:first-child{text-align:left}.invoice-total{display:flex;justify-content:flex-end;gap:20px;font-weight:900;padding-top:12px}.invoice-total span:last-child{font-size:20px;color:var(--green)}.doc-footer{font-size:9px;color:var(--muted);margin-top:15px;border-top:1px solid var(--line);padding-top:7px}
.mission-item{display:grid;grid-template-columns:30px 1fr 18px;gap:9px;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line);background:#fff;padding:9px 2px;text-align:left}.mission-icon{width:27px;height:27px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:900}.mission-item b{font-size:11px;color:var(--green)}.mission-item small{display:block;color:var(--muted);margin-top:2px}
.toast{position:fixed;right:18px;bottom:18px;background:#0d2c50;color:#fff;border-radius:7px;padding:11px 14px;display:none;z-index:99;font-size:12px}.toast.show{display:block}dialog{width:min(690px,92vw);border:0;border-radius:10px;padding:0;box-shadow:0 30px 80px rgba(0,0,0,.35)}dialog::backdrop{background:rgba(0,0,0,.6)}.dialog-in{padding:24px}.dialog-close{position:absolute;right:10px;top:7px;border:0;background:none;font-size:26px}
@media(max-width:1100px){.grid2,.grid3{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(3,1fr)}.four{grid-template-columns:1fr 1fr}}
@media(max-width:760px){.sidebar{position:static;width:100%;height:auto}.main{margin-left:0}.kpis{grid-template-columns:1fr 1fr}.four{grid-template-columns:1fr}}
@media print{body{background:#fff}.sidebar,.topbar,.no-print,.toast,dialog{display:none!important}.main{margin:0}.content{padding:0}.content>*{display:none!important}.print-target{display:block!important}@page{margin:.45in}}
</style>
</head>

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>"$"+Number(n||0).toFixed(2);
const pct=(a,b)=>b?Math.round((Number(a)||0)/(Number(b)||0)*100):0;
let session=JSON.parse(sessionStorage.getItem("nccbSession")||"null");
let state=null,view="dashboard",periodType="DAILY",adminTab="entries",superTab="reps";

function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2500)}
async function request(action,payload={},withSession=true){const body={action,...payload};if(withSession)body.token=session?.token||"";const r=await fetch(GOOGLE_APPS_SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)});const d=await r.json();if(!d.ok)throw new Error(d.error||"Request failed");return d}
function applyRoleUI(){document.querySelectorAll(".admin-only").forEach(x=>x.classList.toggle("hidden",!["Admin","SuperAdmin"].includes(session.role)));document.querySelectorAll(".super-only").forEach(x=>x.classList.toggle("hidden",session.role!=="SuperAdmin"));$("#userName").textContent=session.name;$("#userRole").textContent=session.role}
async function login(e){e.preventDefault();$("#loginMsg").textContent="";try{const d=await request("login",{loginType:$("#loginRole").value,id:$("#loginId").value.trim(),pin:$("#loginPin").value.trim()},false);session={token:d.token,id:d.id,name:d.name,role:d.role};sessionStorage.setItem("nccbSession",JSON.stringify(session));$("#loginPage").classList.add("hidden");$("#appShell").classList.remove("hidden");applyRoleUI();view="dashboard";await load()}catch(err){$("#loginMsg").textContent=err.message}}
function logout(){sessionStorage.removeItem("nccbSession");session=null;state=null;$("#appShell").classList.add("hidden");$("#loginPage").classList.remove("hidden")}
async function load(){try{state=await request("bootstrap",{date:$("#workDate").value,periodType});render()}catch(e){toast(e.message);if(/session/i.test(e.message))logout()}}
function card(title,body,color="blueh"){return `<section class="card"><div class="card-head ${color}">${title}</div><div class="card-body">${body}</div></section>`}
function kpiCards(m,g){const a=[["Calls",m.calls,g.calls],["Conversations",m.conversations,g.conversations],["Qualified",m.qualified,g.qualified],["Enrollments",m.enrollments,g.enrollments],["Enrollment Goal %",pct(m.enrollments,g.enrollments),100]];return `<div class="kpis">${a.map(x=>`<div class="kpi"><small>${x[0]}</small><b>${x[0].includes("%")?x[1]+"%":x[1]}</b><div class="tiny">Goal: ${x[2]||0}</div><div class="progress"><i style="width:${Math.min(100,pct(x[1],x[2]||1))}%"></i></div></div>`).join("")}</div>`}
function productionTable(rows){return `<div class="table-wrap"><table class="data"><thead><tr><th>Rep</th><th>Actual Calls</th><th>Actual Conv.</th><th>Actual Qual.</th><th>Actual Enr.</th><th>Projected Calls</th><th>Projected Conv.</th><th>Projected Qual.</th><th>Projected Enr.</th><th>Goal Enr.</th><th>Goal %</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc(r.name)}</b><div class="tiny">${esc(r.id)}</div></td><td>${r.actual.calls}</td><td>${r.actual.conversations}</td><td>${r.actual.qualified}</td><td><b>${r.actual.enrollments}</b></td><td>${r.projected.calls}</td><td>${r.projected.conversations}</td><td>${r.projected.qualified}</td><td>${r.projected.enrollments}</td><td>${r.goals.enrollments}</td><td>${pct(r.actual.enrollments,r.goals.enrollments)}%</td></tr>`).join("")}</tbody></table></div>`}
function barChart(rows,metric,kind){const max=Math.max(1,...rows.map(r=>Number(r[kind][metric])||0));return `<div class="chart"><div class="chart-title">${kind.toUpperCase()} ${metric.toUpperCase()}</div>${rows.map(r=>{const v=Number(r[kind][metric])||0;return `<div class="bar-row"><span>${esc(r.name.slice(0,22))}</span><div class="bar-track"><div class="bar-fill ${kind==="projected"?"proj":""}" style="width:${Math.round(v/max*100)}%"></div></div><b>${v}</b></div>`}).join("")}</div>`}
function periodToolbar(){return `<div class="toolbar no-print"><label>Production Period<select id="periodSelect"><option value="DAILY" ${periodType==="DAILY"?"selected":""}>Daily</option><option value="WEEKLY" ${periodType==="WEEKLY"?"selected":""}>Weekly</option><option value="MONTHLY" ${periodType==="MONTHLY"?"selected":""}>Monthly</option><option value="QUARTERLY" ${periodType==="QUARTERLY"?"selected":""}>Quarterly</option><option value="YEARLY" ${periodType==="YEARLY"?"selected":""}>Yearly</option></select></label><button class="btn primary" data-action="change-period">Load</button></div>`}
function dashboardView(){return `<h2 class="section-title">Team Dashboard</h2><p class="subhead">Global production is visible to every representative. Your personal KPI is shown beneath the global totals.</p>${kpiCards(state.global.metrics,state.global.goals)}<div style="margin-top:11px">${card("GLOBAL TEAM PRODUCTION",productionTable(state.global.rows),"blueh")}</div><div class="grid2" style="margin-top:11px">${barChart(state.global.rows,"calls","actual")}${barChart(state.global.rows,"enrollments","actual")}</div><h3 style="margin-top:16px">My KPI</h3>${kpiCards(state.me.metrics,state.me.goals)}`}
function productionView(){return `<h2 class="section-title">Global Production</h2><p class="subhead">Daily, weekly, monthly, quarterly and yearly team production—including each rep's published goals.</p>${periodToolbar()}${card(state.global.periodLabel,productionTable(state.global.rows),"blueh")}<div class="grid2" style="margin-top:11px">${barChart(state.global.rows,"enrollments","actual")}${barChart(state.global.rows,"enrollments","projected")}</div>`}
function entryView(){const d=state.myDailyEntry,locked=d&&d.revisionCount>=2;return `<h2 class="section-title">My Production Entry</h2><p class="subhead">Enter actual and projected production. You may correct a submitted record twice. The third correction requires Admin.</p><div class="grid2"><section class="card"><div class="card-head blueh">ACTUAL + PROJECTED PRODUCTION</div><div class="card-body form"><div class="four">${["calls","conversations","qualified","enrollments"].map(k=>`<label>ACTUAL ${k.toUpperCase()}<input id="a_${k}" type="number" min="0" value="${d?d.actual[k]:0}" ${locked?"disabled":""}></label>`).join("")}</div><div class="four">${["calls","conversations","qualified","enrollments"].map(k=>`<label>PROJECTED ${k.toUpperCase()}<input id="p_${k}" type="number" min="0" value="${d?d.projected[k]:0}" ${locked?"disabled":""}></label>`).join("")}</div><div class="note">${d?`Corrections used: <b>${d.revisionCount}</b> of 2.`:"No production entry has been submitted for this date."} ${locked?'<span class="stop">Correction limit reached. Contact administrator.</span>':""}</div><button class="btn primary" data-action="save-entry" ${locked?"disabled":""}>${d?"Save Correction":"Submit Production"}</button></div></section><section class="card"><div class="card-head greenh">MY DAILY KPI</div><div class="card-body">${kpiCards(state.meDaily.metrics,state.meDaily.goals)}</div></section></div>`}
function goalsView(){return `<h2 class="section-title">My Goals</h2><p class="subhead">Your goals are sent to the Admin backend and published globally for the team to see.</p><div class="grid3">${["DAILY","WEEKLY","MONTHLY","QUARTERLY","YEARLY"].map((pt,i)=>{const g=state.myGoals[pt];const colors=["blueh","greenh","purpleh","orangeh","redh"];return `<section class="card"><div class="card-head ${colors[i]}">${pt} PRODUCTION GOALS</div><div class="card-body form">${["calls","conversations","qualified","enrollments"].map(k=>`<label>${k.toUpperCase()}<input data-goal-period="${pt}" data-goal-metric="${k}" type="number" min="0" value="${g[k]||0}"></label>`).join("")}<button class="btn primary" data-save-goal="${pt}">Save ${pt} Goals</button></div></section>`}).join("")}</div>`}
function kpiView(){return `<h2 class="section-title">KPI Center</h2><p class="subhead">All reps see global production and comparative performance.</p>${periodToolbar()}<div class="grid2">${card("MY KPI",kpiCards(state.me.metrics,state.me.goals),"greenh")}${card("GLOBAL KPI",kpiCards(state.global.metrics,state.global.goals),"blueh")}</div><div class="grid2" style="margin-top:11px">${barChart(state.global.rows,"calls","actual")}${barChart(state.global.rows,"enrollments","actual")}</div><div style="margin-top:11px">${productionTable(state.global.rows)}</div>`}
function commissionView(){const c=state.commission;return `<h2 class="section-title">My Commission</h2><p class="subhead">Commission rates are maintained by Admin and your statement is automatically calculated from production.</p><div class="invoice print-target"><div class="doc-head"><img src="${LOGO_DATA}"><div><h2>Sales Commission Statement</h2><div class="doc-meta">Representative: ${esc(session.name)} (${esc(session.id)})<br>${esc(c.periodLabel)}<br>Generated: ${esc(c.generatedAt)}</div></div></div><table><thead><tr><th>Commission Item</th><th>Units</th><th>Rate</th><th>Amount</th></tr></thead><tbody>${c.lines.map(l=>`<tr><td>${esc(l.service)}</td><td>${l.units}</td><td>${money(l.rate)}</td><td>${money(l.amount)}</td></tr>`).join("")}</tbody></table><div class="invoice-total"><span>Total Commission</span><span>${money(c.total)}</span></div><div class="doc-footer">NCCB Sales Team Command Center • Auto-calculated from recorded production.</div></div><button class="btn primary no-print" style="margin-top:10px" data-action="print">Print / Save PDF</button>`}
function reportsView(){const r=state.report;return `<h2 class="section-title">Reports</h2><p class="subhead">Sales reps can pull their own reports. Admin can pull individual or global team reports. Every generated report is timestamped.</p><div class="toolbar no-print"><label>Period<select id="reportPeriod"><option>DAILY</option><option>WEEKLY</option><option>MONTHLY</option><option>QUARTERLY</option><option>YEARLY</option></select></label>${session.role==="SalesRep"?"":`<label>Scope<select id="reportRep"><option value="ALL">All Reps</option>${state.global.rows.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join("")}</select></label>`}<button class="btn primary" data-action="generate-report">Generate</button><button class="btn ghost" data-action="print">Print / Save PDF</button></div><div class="report-paper print-target"><div class="doc-head"><img src="${LOGO_DATA}"><div><h2>NCCB Production Report</h2><div class="doc-meta">${esc(r.periodLabel)}<br>Generated: ${esc(r.generatedAt)}<br>Requested by: ${esc(session.name)}</div></div></div>${productionTable(r.rows)}<div class="doc-footer">Report ID: ${esc(r.reportId)} • Timestamped by NCCB Sales Team Command Center.</div></div>`}
function missionView(){return `<h2 class="section-title">Today's Mission</h2><div class="grid2">${card("TODAY'S MISSION",state.mission.map((m,i)=>`<button class="mission-item" data-mission="${i}"><span class="mission-icon">${i+1}</span><span><b>${esc(m.title)}</b><small>${esc(m.definition)}</small></span><span>›</span></button>`).join(""),"greenh")}${card("DON'T CHASE THE SALE",`<h2 style="text-align:center;color:var(--green)">${esc(state.trust.subheadline)}</h2><p style="text-align:center">${esc(state.trust.body)}</p>`,"redh")}</div>`}
function adminView(){if(!["Admin","SuperAdmin"].includes(session.role))return `<div class="note">Admin access required.</div>`;const tabs=[["entries","All Entries"],["goals","Rep Goals"],["corrections","Corrections"],["commissions","Commission Rules"],["reports","Report Log"]];return `<h2 class="section-title">Admin Backend</h2><p class="subhead">Global administrative access to all production data, goals, corrections, commissions and reporting.</p><div class="tabs">${tabs.map(t=>`<button data-admin-tab="${t[0]}" class="${adminTab===t[0]?"active":""}">${t[1]}</button>`).join("")}</div>${adminContent()}`}
function adminContent(){
 if(adminTab==="entries")return card("ALL PRODUCTION ENTRIES",`<div class="table-wrap"><table class="data"><thead><tr><th>Date</th><th>Rep</th><th>Actual C/C/Q/E</th><th>Projected C/C/Q/E</th><th>Corrections</th><th>Created</th><th>Updated</th></tr></thead><tbody>${state.admin.entries.map(e=>`<tr><td>${e.date}</td><td>${esc(e.repName)} (${e.repId})</td><td>${e.actual.calls}/${e.actual.conversations}/${e.actual.qualified}/${e.actual.enrollments}</td><td>${e.projected.calls}/${e.projected.conversations}/${e.projected.qualified}/${e.projected.enrollments}</td><td>${e.revisionCount}</td><td>${esc(e.createdAt)}</td><td>${esc(e.updatedAt)}</td></tr>`).join("")}</tbody></table></div>`,"blueh");
 if(adminTab==="goals")return card("ALL REP GOALS",`<div class="table-wrap"><table class="data"><thead><tr><th>Rep</th><th>Period</th><th>Calls</th><th>Conv.</th><th>Qual.</th><th>Enroll.</th><th>Updated</th></tr></thead><tbody>${state.admin.goals.map(g=>`<tr><td>${esc(g.repName)} (${g.repId})</td><td>${g.periodType}</td><td>${g.calls}</td><td>${g.conversations}</td><td>${g.qualified}</td><td>${g.enrollments}</td><td>${esc(g.updatedAt)}</td></tr>`).join("")}</tbody></table></div>`,"greenh");
 if(adminTab==="corrections")return card("ADMIN CORRECTION OVERRIDE",`<div class="note">Rep corrections are limited to two. Admin can correct any record regardless of lock status.</div><div class="table-wrap"><table class="data"><thead><tr><th>Date</th><th>Rep</th><th>Corrections Used</th><th>Action</th></tr></thead><tbody>${state.admin.entries.map(e=>`<tr><td>${e.date}</td><td>${esc(e.repName)}</td><td>${e.revisionCount}</td><td><button class="btn red small" data-correct="${e.entryId}">Correct</button></td></tr>`).join("")}</tbody></table></div>`,"redh");
 if(adminTab==="commissions")return card("COMMISSION RULES",`<div class="table-wrap"><table class="data"><thead><tr><th>Service</th><th>Metric</th><th>Rate</th><th>Active</th></tr></thead><tbody>${state.admin.commissionRules.map((r,i)=>`<tr><td><input data-cr="${i}" data-f="service" value="${esc(r.service)}"></td><td><select data-cr="${i}" data-f="metric"><option value="ENROLLMENT" ${r.metric==="ENROLLMENT"?"selected":""}>Enrollment</option><option value="QUALIFIED_OPPORTUNITY" ${r.metric==="QUALIFIED_OPPORTUNITY"?"selected":""}>Qualified Opportunity</option><option value="CONVERSATION" ${r.metric==="CONVERSATION"?"selected":""}>Conversation</option><option value="CALL" ${r.metric==="CALL"?"selected":""}>Call</option></select></td><td><input data-cr="${i}" data-f="rate" type="number" step=".01" value="${r.rate}"></td><td><select data-cr="${i}" data-f="active"><option value="TRUE" ${r.active?"selected":""}>TRUE</option><option value="FALSE" ${!r.active?"selected":""}>FALSE</option></select></td></tr>`).join("")}</tbody></table></div><button class="btn green" style="margin-top:10px" data-action="save-commission-rules">Save Rules</button>`,"greenh");
 return card("REPORT LOG",`<div class="table-wrap"><table class="data"><thead><tr><th>Report ID</th><th>Requested By</th><th>Role</th><th>Period</th><th>Scope</th><th>Timestamp</th></tr></thead><tbody>${state.admin.reportLog.map(r=>`<tr><td>${esc(r.reportId)}</td><td>${esc(r.requestedBy)}</td><td>${esc(r.role)}</td><td>${esc(r.periodType)}</td><td>${esc(r.repScope)}</td><td>${esc(r.timestamp)}</td></tr>`).join("")}</tbody></table></div>`,"purpleh");
}
function superAdminView(){if(session.role!=="SuperAdmin")return `<div class="note">Super Admin access required.</div>`;const tabs=[["reps","Reps"],["admins","Admins"]];return `<h2 class="section-title">Super Admin</h2><div class="tabs">${tabs.map(t=>`<button data-super-tab="${t[0]}" class="${superTab===t[0]?"active":""}">${t[1]}</button>`).join("")}</div>${superContent()}`}
function superContent(){if(superTab==="reps")return card("REP ACCOUNT MANAGEMENT",`<div class="table-wrap"><table class="data"><thead><tr><th>Rep ID</th><th>Name</th><th>Active</th><th>New PIN</th></tr></thead><tbody>${state.super.reps.map(r=>`<tr><td>${r.id}</td><td><input data-rep="${r.id}" data-rf="name" value="${esc(r.name)}"></td><td><select data-rep="${r.id}" data-rf="active"><option value="TRUE" ${r.active?"selected":""}>TRUE</option><option value="FALSE" ${!r.active?"selected":""}>FALSE</option></select></td><td><input data-rep="${r.id}" data-rf="pin" placeholder="leave blank"></td></tr>`).join("")}</tbody></table></div><button class="btn primary" data-action="save-reps" style="margin-top:10px">Save Rep Accounts</button>`,"blueh");return card("ADMIN ACCOUNT MANAGEMENT",`<div class="table-wrap"><table class="data"><thead><tr><th>ID</th><th>Name</th><th>Role</th><th>Active</th><th>New PIN</th></tr></thead><tbody>${state.super.admins.map(a=>`<tr><td>${a.id}</td><td><input data-adm="${a.id}" data-af="name" value="${esc(a.name)}"></td><td><select data-adm="${a.id}" data-af="role"><option ${a.role==="Admin"?"selected":""}>Admin</option><option ${a.role==="SuperAdmin"?"selected":""}>SuperAdmin</option></select></td><td><select data-adm="${a.id}" data-af="active"><option value="TRUE" ${a.active?"selected":""}>TRUE</option><option value="FALSE" ${!a.active?"selected":""}>FALSE</option></select></td><td><input data-adm="${a.id}" data-af="pin" placeholder="leave blank"></td></tr>`).join("")}</tbody></table></div><button class="btn primary" data-action="save-admins" style="margin-top:10px">Save Admin Accounts</button>`,"redh")}
function render(){if(!state)return;$("#dateText").textContent=new Date($("#workDate").value+"T12:00:00").toLocaleDateString(undefined,{weekday:"long",year:"numeric",month:"long",day:"numeric"});let html="";switch(view){case"dashboard":html=dashboardView();break;case"production":html=productionView();break;case"entry":html=entryView();break;case"goals":html=goalsView();break;case"kpi":html=kpiView();break;case"commission":html=commissionView();break;case"reports":html=reportsView();break;case"mission":html=missionView();break;case"admin":html=adminView();break;case"superadmin":html=superAdminView();break;default:html=dashboardView();}$("#content").innerHTML=html;bind()}
function bind(){
 document.querySelector("[data-action=change-period]")?.addEventListener("click",()=>{periodType=$("#periodSelect").value;load()});
 document.querySelector("[data-action=save-entry]")?.addEventListener("click",saveEntry);
 document.querySelectorAll("[data-save-goal]").forEach(b=>b.addEventListener("click",()=>saveGoal(b.dataset.saveGoal)));
 document.querySelectorAll("[data-mission]").forEach(b=>b.addEventListener("click",()=>openMission(+b.dataset.mission)));
 document.querySelectorAll("[data-action=print]").forEach(b=>b.addEventListener("click",()=>window.print()));
 document.querySelector("[data-action=generate-report]")?.addEventListener("click",generateReport);
 document.querySelectorAll("[data-admin-tab]").forEach(b=>b.addEventListener("click",()=>{adminTab=b.dataset.adminTab;render()}));
 document.querySelectorAll("[data-correct]").forEach(b=>b.addEventListener("click",()=>adminCorrect(b.dataset.correct)));
 document.querySelector("[data-action=save-commission-rules]")?.addEventListener("click",saveCommissionRules);
 document.querySelectorAll("[data-super-tab]").forEach(b=>b.addEventListener("click",()=>{superTab=b.dataset.superTab;render()}));
 document.querySelector("[data-action=save-reps]")?.addEventListener("click",saveReps);
 document.querySelector("[data-action=save-admins]")?.addEventListener("click",saveAdmins);
}
async function saveEntry(){const a={calls:+$("#a_calls").value||0,conversations:+$("#a_conversations").value||0,qualified:+$("#a_qualified").value||0,enrollments:+$("#a_enrollments").value||0},p={calls:+$("#p_calls").value||0,conversations:+$("#p_conversations").value||0,qualified:+$("#p_qualified").value||0,enrollments:+$("#p_enrollments").value||0};try{await request("saveDailyEntry",{entry:{date:$("#workDate").value,actual:a,projected:p}});toast("Production saved");await load()}catch(e){toast(e.message)}}
async function saveGoal(pt){const g={};document.querySelectorAll(`[data-goal-period="${pt}"]`).forEach(i=>g[i.dataset.goalMetric]=+i.value||0);try{await request("saveRepGoal",{periodType:pt,goals:g,date:$("#workDate").value});toast(pt+" goals saved");await load()}catch(e){toast(e.message)}}
function openMission(i){const m=state.mission[i];$("#modalBody").innerHTML=`<div class="dialog-in"><h2>${esc(m.title)}</h2><h4>Sales Meaning</h4><p>${esc(m.definition)}</p><h4>Talk Track</h4><p><b>${esc(m.talkTrack)}</b></p><h4>Coaching Points</h4><ul>${m.points.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`;$("#modal").showModal()}
async function generateReport(){try{const pt=$("#reportPeriod").value,scope=session.role==="SalesRep"?session.id:($("#reportRep")?.value||"ALL");state.report=await request("generateReport",{periodType:pt,repScope:scope,date:$("#workDate").value});render()}catch(e){toast(e.message)}}
async function adminCorrect(id){const e=state.admin.entries.find(x=>x.entryId===id);if(!e)return;const c=prompt("Actual calls",e.actual.calls);if(c===null)return;const v=prompt("Actual conversations",e.actual.conversations);if(v===null)return;const q=prompt("Actual qualified",e.actual.qualified);if(q===null)return;const n=prompt("Actual enrollments",e.actual.enrollments);if(n===null)return;try{await request("adminCorrectEntry",{entryId:id,actual:{calls:+c||0,conversations:+v||0,qualified:+q||0,enrollments:+n||0}});toast("Admin correction saved");await load()}catch(err){toast(err.message)}}
async function saveCommissionRules(){const rows=state.admin.commissionRules.map((r,i)=>({service:document.querySelector(`[data-cr="${i}"][data-f="service"]`).value,metric:document.querySelector(`[data-cr="${i}"][data-f="metric"]`).value,rate:+document.querySelector(`[data-cr="${i}"][data-f="rate"]`).value||0,active:document.querySelector(`[data-cr="${i}"][data-f="active"]`).value==="TRUE"}));try{await request("saveCommissionRules",{rows});toast("Commission rules saved");await load()}catch(e){toast(e.message)}}
async function saveReps(){const map={};document.querySelectorAll("[data-rep]").forEach(i=>{const id=i.dataset.rep;(map[id]??={id})[i.dataset.rf]=i.value});try{await request("saveReps",{rows:Object.values(map)});toast("Rep accounts saved");await load()}catch(e){toast(e.message)}}
async function saveAdmins(){const map={};document.querySelectorAll("[data-adm]").forEach(i=>{const id=i.dataset.adm;(map[id]??={id})[i.dataset.af]=i.value});try{await request("saveAdmins",{rows:Object.values(map)});toast("Admin accounts saved");await load()}catch(e){toast(e.message)}}

function updateLoginLabel(){$("#idLabel").textContent=$("#loginRole").value==="SalesRep"?"Rep ID (200-250)":"Admin ID";$("#loginId").placeholder=$("#loginRole").value==="SalesRep"?"e.g. 201":"e.g. SA2"}
$("#loginRole").addEventListener("change",updateLoginLabel);updateLoginLabel();$("#loginForm").addEventListener("submit",login);$("#logoutBtn").addEventListener("click",logout);$("#refreshBtn").addEventListener("click",load);$("#workDate").value=new Date().toISOString().slice(0,10);$("#workDate").addEventListener("change",load);
document.querySelectorAll("#mainNav button").forEach(b=>b.addEventListener("click",async()=>{if(b.classList.contains("hidden"))return;document.querySelectorAll("#mainNav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");view=b.dataset.view;render()}));
(async()=>{if(session){$("#loginPage").classList.add("hidden");$("#appShell").classList.remove("hidden");applyRoleUI();await load()}})();
</script>
</body>
</html>
