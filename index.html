<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NCCB Sales Team Command Center</title>
<style>
:root{
  --nav:#071b35;--nav2:#0c2b52;--blue:#1454a3;--blue2:#1e68c9;
  --red:#c91e28;--green:#168044;--orange:#e77a12;--purple:#6240a5;
  --ink:#142033;--muted:#657286;--line:#dce3eb;--bg:#f3f6fa;--card:#fff;
  --shadow:0 8px 25px rgba(12,32,56,.08)
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.sidebar{position:fixed;inset:0 auto 0 0;width:238px;background:linear-gradient(180deg,var(--nav),#06152a);color:#fff;display:flex;flex-direction:column;z-index:20}
.logo{padding:23px 20px 20px;border-bottom:1px solid rgba(255,255,255,.1)}
.logo-mark{font-size:34px;font-weight:900;color:#1681e8}.logo-sub{font-size:11px;font-weight:800;letter-spacing:.7px;color:#dbe7f5}
#nav{padding:14px 10px;display:grid;gap:3px}
.nav-item{border:0;background:transparent;color:#dce8f7;text-align:left;padding:12px 13px;border-radius:8px;font-weight:700;display:flex;gap:12px;align-items:center}
.nav-item:hover,.nav-item.active{background:#0c66c8;color:#fff}
.sidebar-footer{margin-top:auto;padding:17px;border-top:1px solid rgba(255,255,255,.1);display:flex;gap:10px;align-items:center;font-size:12px}
.avatar{width:40px;height:40px;border-radius:50%;background:#d9e5f4;color:#173a67;display:grid;place-items:center;font-weight:900}
.online{display:inline-block;width:7px;height:7px;background:#35c879;border-radius:50%;margin-right:4px}
.main{margin-left:238px;min-height:100vh}
.topbar{min-height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:12px 24px;position:sticky;top:0;z-index:10}
.title-wrap{display:flex;gap:12px;align-items:center}.title-wrap h1{font-size:20px;margin:0;font-weight:900}.title-wrap p{margin:4px 0 0;color:var(--muted);font-size:12px}
.icon-btn{display:none;border:0;background:none;font-size:23px}
.top-actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.top-actions input{padding:9px 10px;border:1px solid var(--line);border-radius:7px}
.button{border:0;border-radius:7px;padding:10px 14px;font-weight:800}.button.primary{background:var(--blue);color:#fff}.button.ghost{background:#fff;border:1px solid var(--line)}
.connection{font-size:10px;font-weight:900;padding:7px 9px;border-radius:99px;background:#fff4db;color:#9a5b00}
#content{padding:18px 20px 28px}
.grid{display:grid;grid-template-columns:1.18fr .72fr 1fr 1fr;gap:12px}.grid2{display:grid;grid-template-columns:1.1fr .9fr;gap:12px;margin-top:12px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}.card-head{padding:13px 15px;color:#fff;font-weight:900;display:flex;justify-content:space-between;align-items:center}.card-body{padding:15px}
.head-red{background:var(--red)}.head-purple{background:var(--purple)}.head-blue{background:var(--blue2)}.head-green{background:var(--green)}.head-orange{background:var(--orange)}
.metric-table{width:100%;border-collapse:collapse;font-size:12px}.metric-table th{background:#f6f8fb;color:#526176;font-size:10px;text-transform:uppercase}.metric-table th,.metric-table td{padding:9px 6px;border:1px solid var(--line);text-align:center}.metric-table td:first-child{text-align:left;font-weight:800}
.num{font-size:19px;font-weight:900;color:var(--blue)}.red-num{color:var(--red)}
.goal-line{font-size:13px;font-weight:800;margin-bottom:12px}.goal-line strong{font-size:31px;color:var(--red)}
.progress{height:11px;border-radius:99px;background:#e8edf3;overflow:hidden}.progress i{height:100%;display:block;background:var(--red);width:0}.tiny{font-size:11px;color:var(--muted)}
.beat-body{display:grid;gap:12px;text-align:center;padding:17px}.beat-number{font-size:28px;font-weight:900;color:var(--purple)}.beat-message{font-size:16px;font-weight:900;color:var(--purple);border-top:1px solid var(--line);padding-top:14px}
.mission-list{display:grid}.mission-item{display:grid;grid-template-columns:34px 1fr 20px;gap:10px;align-items:center;padding:11px 2px;border:0;border-bottom:1px solid var(--line);background:#fff;text-align:left;width:100%}.mission-item:hover{background:#f3fbf6}
.mission-icon{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#fff;background:var(--green)}.mission-item b{font-size:12px;color:var(--green)}.mission-item small{display:block;color:var(--muted);margin-top:2px}
.score-person{border:1px solid var(--line);border-radius:8px;margin-bottom:10px;overflow:hidden}.score-person h3{margin:0;padding:9px 11px;color:var(--blue);font-size:13px;background:#f8fbff}.score-stats{display:grid;grid-template-columns:repeat(4,1fr)}.score-stat{padding:9px 5px;text-align:center;border-right:1px solid var(--line)}.score-stat:last-child{border-right:0}.score-stat span{font-size:9px;text-transform:uppercase;color:#68768a}.score-stat b{display:block;font-size:21px;margin-top:4px}
.objection-quote{font-size:20px;font-weight:900;text-align:center;margin:10px 0 16px}.coaching-list{margin:0;padding-left:18px;color:#3f4c5e}.coaching-list li{margin:7px 0}
.trust-card{min-height:100%;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:28px}.heart{font-size:54px;color:var(--red)}.trust-card h2{margin:8px 0;color:#121820;font-size:23px}.trust-card h2 span{color:var(--green)}.trust-card p{color:var(--muted);line-height:1.5}.edit-btn{background:var(--red);color:#fff;border:0;border-radius:7px;padding:10px 15px;font-weight:900;align-self:center}
.kpi-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:12px}.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:15px;box-shadow:var(--shadow)}.kpi .label{font-size:10px;color:var(--muted);font-weight:900;text-transform:uppercase}.kpi .value{font-size:28px;font-weight:900;margin:6px 0}.kpi .compare{font-size:10px;color:var(--muted)}
.section-title{margin:4px 0 14px;font-size:19px}.form{display:grid;gap:10px}.form label{font-size:11px;font-weight:900;color:#526176}.form input,.form textarea,.form select{width:100%;border:1px solid var(--line);border-radius:7px;padding:10px;background:#fff}.form textarea{min-height:110px}
.table-wrap{overflow:auto}.data-table{width:100%;border-collapse:collapse;background:#fff}.data-table th,.data-table td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:12px}.data-table th{font-size:10px;text-transform:uppercase;color:#69778a}
.pill{display:inline-block;padding:5px 8px;border-radius:99px;font-size:10px;font-weight:900}.pill.green{background:#e8f7ef;color:#166a3b}.pill.red{background:#ffebed;color:#a81722}
.toast{position:fixed;right:20px;bottom:20px;z-index:99;background:#102a49;color:#fff;padding:12px 15px;border-radius:8px;box-shadow:var(--shadow);display:none}.toast.show{display:block}
dialog{width:min(650px,92vw);border:0;border-radius:12px;padding:0;box-shadow:0 25px 80px rgba(0,0,0,.35)}dialog::backdrop{background:rgba(2,12,25,.68)}.dialog-close{position:absolute;right:12px;top:10px;border:0;background:transparent;font-size:28px}.dialog-inner{padding:26px}
@media(max-width:1200px){.grid{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr 1fr}.kpi-strip{grid-template-columns:repeat(3,1fr)}}
@media(max-width:780px){.sidebar{transform:translateX(-100%);transition:.2s}.sidebar.open{transform:translateX(0)}.main{margin-left:0}.icon-btn{display:block}.grid,.grid2,.grid3{grid-template-columns:1fr}.kpi-strip{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="logo"><div class="logo-mark">NCCB</div><div class="logo-sub">SALES COMMAND CENTER</div></div>
    <nav id="nav">
      <button class="nav-item active" data-view="dashboard">⌂ Dashboard</button>
      <button class="nav-item" data-view="scoreboard">◫ Team Scoreboard</button>
      <button class="nav-item" data-view="activity">▤ Activity Entry</button>
      <button class="nav-item" data-view="mission">★ Today's Mission</button>
      <button class="nav-item" data-view="commission">$ Commission Tracker</button>
      <button class="nav-item" data-view="admin">⚙ Admin / Content</button>
    </nav>
    <div class="sidebar-footer"><div class="avatar">N</div><div><b>NCCB Sales</b><br><small><span class="online"></span> Command Center</small></div></div>
  </aside>

  <section class="main">
    <header class="topbar">
      <div class="title-wrap">
        <button id="mobileMenu" class="icon-btn">☰</button>
        <div><h1>★ NCCB SALES TEAM COMMAND CENTER ★</h1><p id="dateLabel"></p></div>
      </div>
      <div class="top-actions">
        <input id="workDate" type="date">
        <button id="refreshBtn" class="button ghost">↻ Refresh</button>
        <span id="connection" class="connection">DEMO DATA</span>
      </div>
    </header>
    <div id="toast" class="toast"></div>
    <main id="content"></main>
  </section>
</div>

<dialog id="missionDialog">
  <button class="dialog-close" onclick="missionDialog.close()">×</button>
  <div id="missionDialogBody"></div>
</dialog>

<script>
/* ============================================================
   NCCB CONFIGURATION
   ============================================================
   1) Deploy your Google Apps Script as a Web App.
   2) Paste the Web App URL below.
   3) If the URL is left blank, this index.html runs in DEMO mode.
*/
const GOOGLE_APPS_SCRIPT_URL = ""; // Example: https://script.google.com/macros/s/XXXXX/exec

const DEMO = {
  teamGoal: 6,
  yesterday: 4,
  metrics: {calls:77, conversations:30, qualified:9, enrollments:3, refunds:0, cancellations:0},
  employees: [
    {id:"001",name:"Employee 1",calls:45,conversations:18,qualified:6,enrollments:2},
    {id:"002",name:"Employee 2",calls:32,conversations:12,qualified:3,enrollments:1}
  ],
  mission: [
    {key:"ASK",title:"ASK QUESTIONS",definition:"Open the conversation and uncover the client's needs, goals, urgency and decision criteria before recommending a solution.",talkTrack:"What would you most like to change about your current situation, and what would success look like for you?",points:["Use open-ended questions","Do not interrupt","Confirm the client's goal before moving forward"]},
    {key:"LISTEN",title:"LISTEN",definition:"Demonstrate that you understand the client's words, concerns and desired outcome.",talkTrack:"What I'm hearing is ____. Did I understand that correctly?",points:["Reflect key facts","Listen for practical and emotional concerns","Do not assume"]},
    {key:"EDUCATE",title:"EDUCATE",definition:"Explain relevant options, expectations, costs and next steps clearly enough for an informed decision.",talkTrack:"Let me walk you through how this works, what it can and cannot do, and what the next step would be.",points:["Use plain language","Avoid guarantees","Check understanding"]},
    {key:"RECOMMEND",title:"RECOMMEND",definition:"Connect an appropriate solution to the client's stated goals without pressure or misrepresentation.",talkTrack:"Based on what you told me, the option that appears to fit your stated goal is ____. Here is why.",points:["Tie recommendation to stated goals","Explain material terms","Avoid unsuitable recommendations"]},
    {key:"CLOSE",title:"CLOSE",definition:"Ask for the client's decision and complete the appropriate next step after questions are answered and required consents are satisfied.",talkTrack:"Would you like to move forward with that option, or is there anything you want clarified first?",points:["Ask directly and respectfully","Resolve questions","Document outcome and required consent"]}
  ],
  trust:{headline:"DON'T CHASE THE SALE",body:"EARN THE CLIENT'S TRUST. Lead with questions, listening, education and a recommendation that fits the client's stated goals."},
  commissionRules:[
    {name:"Credit Counseling",amount:10},{name:"Credit Restoration",amount:20},
    {name:"Debt Management",amount:30},{name:"Debt Settlement",amount:35}
  ]
};

let state = JSON.parse(JSON.stringify(DEMO));
let view = "dashboard";
let onlineMode = false;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = (a,b) => b ? Math.round(a/b*100) : 0;
const money = n => "$"+Number(n||0).toFixed(0);

function showToast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2500)}
function setConnection(ok){onlineMode=ok;const c=$("#connection");c.textContent=ok?"LIVE GOOGLE SHEETS":"DEMO DATA";c.style.background=ok?"#e8f7ef":"#fff4db";c.style.color=ok?"#166a3b":"#9a5b00"}

async function gas(action,payload={}){
  if(!GOOGLE_APPS_SCRIPT_URL) throw new Error("Google Apps Script URL is not configured.");
  const r = await fetch(GOOGLE_APPS_SCRIPT_URL,{
    method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify({action,...payload})
  });
  const data=await r.json();
  if(data.ok===false) throw new Error(data.error||"Google Apps Script error");
  return data;
}

async function load(){
  if(!GOOGLE_APPS_SCRIPT_URL){setConnection(false);render();return;}
  try{
    const data=await gas("dashboard",{date:$("#workDate").value});
    state={...state,...data};
    setConnection(true);
  }catch(e){setConnection(false);showToast(e.message)}
  render();
}

function card(head,body,cls){return `<section class="card"><div class="card-head ${cls}">${head}</div><div class="card-body">${body}</div></section>`}

function challengeCard(){
  const m=state.metrics,g=state.teamGoal;
  return card("🔥 DAILY SALES CHALLENGE",`
  <div class="goal-line">TEAM GOAL <strong>${g}</strong> QUALIFIED ENROLLMENTS</div>
  <table class="metric-table"><thead><tr><th>EMPLOYEE</th><th>GOAL</th><th>ACTUAL</th><th>STATUS</th></tr></thead><tbody>
  ${state.employees.map(e=>`<tr><td>${esc(e.name)}</td><td>3</td><td class="num">${e.enrollments}</td><td>${e.enrollments>=3?'<span class="pill green">★ ON PACE</span>':'<span class="pill red">KEEP GOING</span>'}</td></tr>`).join("")}
  <tr><td>TEAM TOTAL</td><td>${g}</td><td class="num red-num">${m.enrollments}</td><td>${m.enrollments>=g?'<span class="pill green">GOAL HIT</span>':'<span class="pill red">KEEP PUSHING</span>'}</td></tr>
  </tbody></table>
  <div style="margin-top:12px"><div class="progress"><i style="width:${Math.min(100,pct(m.enrollments,g))}%"></i></div><div class="tiny" style="margin-top:5px">${pct(m.enrollments,g)}% of team goal</div></div>`,`head-red`);
}
function beatCard(){
  return card("🚀 BEAT YESTERDAY",`<div class="beat-body">
    <div>YESTERDAY<div class="beat-number">${state.yesterday}</div></div>
    <div>TODAY<div class="beat-number">${state.metrics.enrollments}</div></div>
    <div>GOAL<div class="beat-number">${state.teamGoal}</div></div>
    <div class="beat-message">${state.metrics.enrollments>state.yesterday?"★ YOU BEAT YESTERDAY!":"LET'S BEAT YESTERDAY!"}</div>
  </div>`,`head-purple`);
}
function scoreboardCard(){
  return card("▮ DAILY SCOREBOARD",state.employees.map(e=>`
  <div class="score-person"><h3>👤 ${esc(e.name)}</h3><div class="score-stats">
    <div class="score-stat"><span>Calls</span><b>${e.calls}</b></div>
    <div class="score-stat"><span>Conversations</span><b>${e.conversations}</b></div>
    <div class="score-stat"><span>Qualified</span><b>${e.qualified}</b></div>
    <div class="score-stat"><span>Enrollments</span><b>${e.enrollments}</b></div>
  </div></div>`).join(""),"head-blue");
}
function commissionCard(){
  return card("💵 COMMISSION TRACKER",state.commissionRules.map(x=>`
    <div style="display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid var(--line)">
      <span>${esc(x.name)}</span><b style="color:var(--green)">${money(x.amount)}</b>
    </div>`).join("")+`<hr><div style="display:flex;justify-content:space-between;font-weight:900"><span>TEAM ENROLLMENTS</span><span>${state.metrics.enrollments}</span></div>`,"head-green");
}
function missionCard(){
  return card("★ TODAY'S MISSION",`<div class="mission-list">${state.mission.map((x,i)=>`
  <button class="mission-item" data-mission="${i}">
    <span class="mission-icon">${i+1}</span>
    <span><b>${esc(x.title)}</b><small>${esc(x.definition.slice(0,80))}...</small></span>
    <span>›</span>
  </button>`).join("")}</div>
  <div style="margin-top:12px;text-align:center;font-size:10px;font-weight:900;color:#174a83">FOCUS • DISCIPLINE • CONSISTENCY = <span style="color:#c91e28">SUCCESS</span></div>`,"head-green");
}
function objectionCard(){
  return card("💬 OBJECTION OF THE DAY",`
  <div class="objection-quote">“I NEED TO THINK ABOUT IT.”</div>
  <h4 style="color:var(--orange);text-align:center">HOW WOULD YOU RESPOND?</h4>
  <ul class="coaching-list"><li>Acknowledge their concern</li><li>Reflect on their goals</li><li>Refocus on the benefits</li><li>Ask for a decision</li></ul>
  <p style="text-align:center;color:var(--orange);font-weight:900">💡 LET'S HELP THEM TAKE THE NEXT STEP!</p>`,"head-orange");
}
function trustCard(){
  return `<section class="card"><div class="trust-card">
    <div class="heart">♡</div>
    <h2>${esc(state.trust.headline)} –<br><span>EARN THE CLIENT'S TRUST.</span></h2>
    <p>${esc(state.trust.body)}</p>
    <button class="edit-btn" data-action="edit-trust">✎ Edit Message</button>
  </div></section>`;
}
function kpis(){
  const m=state.metrics;
  return `<div class="kpi-strip">${[
    ["TOTAL CALLS",m.calls],["TOTAL CONVERSATIONS",m.conversations],["QUALIFIED OPPORTUNITIES",m.qualified],["ENROLLMENTS",m.enrollments],["TEAM GOAL",state.teamGoal]
  ].map((x,i)=>`<div class="kpi"><div class="label">${x[0]}</div><div class="value">${x[1]}</div><div class="compare">${i===4?`Progress: ${pct(m.enrollments,state.teamGoal)}%`:"Live daily metric"}</div></div>`).join("")}</div>`;
}
function dashboardView(){return `<div class="grid">${challengeCard()}${beatCard()}${scoreboardCard()}${commissionCard()}</div><div class="grid3">${missionCard()}${objectionCard()}${trustCard()}</div>${kpis()}`}
function scoreboardView(){return `<h2 class="section-title">Team Scoreboard</h2>${scoreboardCard()}${kpis()}`}
function activityView(){
  return `<h2 class="section-title">Activity Entry</h2><div class="grid2">
    <section class="card"><div class="card-head head-blue">CAPTURE SALES ACTIVITY</div><div class="card-body form">
      <label>EMPLOYEE<select id="activityEmployee">${state.employees.map(e=>`<option value="${esc(e.id)}">${esc(e.name)}</option>`).join("")}</select></label>
      <label>EVENT<select id="activityType">
        <option value="CALL">Call</option><option value="CONVERSATION">Conversation</option>
        <option value="QUALIFIED_OPPORTUNITY">Qualified Opportunity</option><option value="ENROLLMENT">Enrollment</option>
        <option value="DMP_CONVERSION">DMP Conversion</option><option value="REFUND">Refund</option><option value="CANCELLATION">Cancellation</option>
      </select></label>
      <label>QUANTITY<input id="activityQty" type="number" min="1" value="1"></label>
      <button class="button primary" data-action="add-activity">Save Activity</button>
    </div></section>
    <section class="card"><div class="card-head head-green">TODAY'S LIVE TOTALS</div><div class="card-body">${kpis()}</div></section>
  </div>`;
}
function missionView(){return `<h2 class="section-title">Today's Mission</h2><div class="grid2">${missionCard()}${trustCard()}</div>`}
function commissionView(){return `<h2 class="section-title">Commission Tracker</h2>${commissionCard()}`}
function adminView(){
  return `<h2 class="section-title">Admin / Content</h2><div class="grid2">
    <section class="card"><div class="card-head head-green">MISSION CONTENT</div><div class="card-body">
      ${state.mission.map((x,i)=>`<div style="border-bottom:1px solid var(--line);padding:12px 0"><b>${esc(x.title)}</b><button class="button ghost" style="float:right" data-edit-mission="${i}">Edit</button><div class="tiny">${esc(x.definition)}</div></div>`).join("")}
    </div></section>
    <section class="card"><div class="card-head head-red">TRUST MESSAGE</div><div class="card-body"><h3>${esc(state.trust.headline)}</h3><p>${esc(state.trust.body)}</p><button class="button primary" data-action="edit-trust">Edit Trust Message</button></div></section>
  </div>`;
}

function render(){
  $("#dateLabel").textContent=new Date($("#workDate").value+"T12:00:00").toLocaleDateString(undefined,{weekday:"long",year:"numeric",month:"long",day:"numeric"});
  const c=$("#content");
  if(view==="dashboard") c.innerHTML=dashboardView();
  if(view==="scoreboard") c.innerHTML=scoreboardView();
  if(view==="activity") c.innerHTML=activityView();
  if(view==="mission") c.innerHTML=missionView();
  if(view==="commission") c.innerHTML=commissionView();
  if(view==="admin") c.innerHTML=adminView();
  bindView();
}

function bindView(){
  document.querySelectorAll("[data-mission]").forEach(b=>b.addEventListener("click",()=>openMission(Number(b.dataset.mission))));
  document.querySelectorAll("[data-action=edit-trust]").forEach(b=>b.addEventListener("click",editTrust));
  document.querySelectorAll("[data-edit-mission]").forEach(b=>b.addEventListener("click",()=>editMission(Number(b.dataset.editMission))));
  document.querySelector("[data-action=add-activity]")?.addEventListener("click",addActivity);
}
function openMission(i){
  const x=state.mission[i];
  $("#missionDialogBody").innerHTML=`<div class="dialog-inner"><h2 style="color:var(--green)">${esc(x.title)}</h2><h3>Sales meaning</h3><p>${esc(x.definition)}</p><h3>Talk track</h3><p><b>${esc(x.talkTrack)}</b></p><h3>Coaching points</h3><ul>${x.points.map(p=>`<li>${esc(p)}</li>`).join("")}</ul></div>`;
  $("#missionDialog").showModal();
}
async function editTrust(){
  const headline=prompt("Trust headline:",state.trust.headline); if(headline===null)return;
  const body=prompt("Trust message:",state.trust.body); if(body===null)return;
  if(onlineMode){
    try{await gas("updateTrust",{content:{headline,body}})}catch(e){showToast(e.message);return}
  }
  state.trust={headline,body};render();showToast("Trust message updated");
}
async function editMission(i){
  const x=state.mission[i];
  const definition=prompt("Sales meaning:",x.definition);if(definition===null)return;
  const talkTrack=prompt("Talk track:",x.talkTrack);if(talkTrack===null)return;
  if(onlineMode){
    try{await gas("updateMission",{key:x.key,content:{definition,talkTrack,points:x.points}})}catch(e){showToast(e.message);return}
  }
  state.mission[i]={...x,definition,talkTrack};render();showToast("Mission updated");
}
async function addActivity(){
  const employeeId=$("#activityEmployee").value,eventType=$("#activityType").value,quantity=Number($("#activityQty").value||1);
  if(onlineMode){
    try{
      await gas("addActivity",{activity:{employeeId,eventType,quantity}});
      showToast("Activity saved to Google Sheets");
      await load(); return;
    }catch(e){showToast(e.message);return}
  }
  const emp=state.employees.find(e=>e.id===employeeId);
  const map={CALL:"calls",CONVERSATION:"conversations",QUALIFIED_OPPORTUNITY:"qualified",ENROLLMENT:"enrollments"};
  if(emp&&map[eventType]){emp[map[eventType]]+=quantity;state.metrics[map[eventType]]+=quantity}
  render();showToast("Demo activity recorded");
}

document.querySelectorAll(".nav-item").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll(".nav-item").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");view=b.dataset.view;render();$(".sidebar").classList.remove("open");
}));
$("#refreshBtn").addEventListener("click",load);
$("#workDate").value=new Date().toISOString().slice(0,10);
$("#workDate").addEventListener("change",load);
$("#mobileMenu").addEventListener("click",()=>$(".sidebar").classList.toggle("open"));
render();
load();
</script>
