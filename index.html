<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NCCB Sales Team Command Center</title>
<style>
:root{--nav:#071b35;--blue:#1764c0;--green:#178447;--red:#c91e28;--orange:#ed7300;--purple:#6844a5;--ink:#142033;--muted:#68758a;--line:#dce3eb;--bg:#f3f6fa;--card:#fff;--shadow:0 8px 24px rgba(16,38,68,.08)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.login-page{min-height:100vh;display:grid;place-items:center;background:#fbf6f1;padding:20px}.login-card{width:min(430px,94vw);background:#fff;border:2px solid var(--orange);border-radius:11px;padding:28px 24px 32px}.login-logo{display:block;width:130px;margin:0 auto 22px}.login-card h1{font-size:19px;color:#b55700;text-align:center;margin:0 0 14px}.login-card label{display:block;font-size:13px;color:#677180;margin:12px 0 5px}.login-card input,.login-card select{width:100%;height:38px;border:1px solid #d4d9df;border-radius:5px;padding:0 10px}.login-btn{display:block;margin:16px auto 0;border:0;background:var(--orange);color:#fff;border-radius:5px;padding:9px 18px}.login-msg{min-height:18px;margin-top:10px;color:var(--red);font-size:12px;text-align:center}
.sidebar{position:fixed;inset:0 auto 0 0;width:225px;background:linear-gradient(180deg,#071b35,#06152a);color:#fff;display:flex;flex-direction:column;z-index:20}.brand{padding:18px;border-bottom:1px solid rgba(255,255,255,.09)}.brand img{width:88px;background:#fff;border-radius:5px;padding:3px}.brand b{display:block;margin-top:8px;font-size:12px}.nav{padding:12px 8px;display:grid;gap:3px}.nav button{border:0;background:transparent;color:#dce7f4;border-radius:7px;padding:10px 11px;text-align:left;font-weight:700}.nav button.active,.nav button:hover{background:#0b66c8;color:#fff}.userbox{margin-top:auto;padding:14px;border-top:1px solid rgba(255,255,255,.1);font-size:12px}.userbox small{display:block;color:#a9bbcf;margin:4px 0 10px}
.main{margin-left:225px;min-height:100vh}.topbar{position:sticky;top:0;z-index:15;background:#fff;border-bottom:1px solid var(--line);padding:11px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}.topbar h1{margin:0;font-size:20px}.topbar p{margin:3px 0 0;font-size:11px;color:var(--muted)}.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.top-actions input{border:1px solid var(--line);border-radius:6px;padding:8px}.badge{padding:6px 8px;border-radius:99px;background:#e8f7ef;color:#166a3b;font-size:10px;font-weight:900;transition:.2s}.badge.syncing{background:#fff4db;color:#9a5b00}.badge.synced{background:#e8f7ef;color:#166a3b}.content{padding:16px 18px 30px}
.btn{border:0;border-radius:6px;padding:9px 12px;font-weight:800}.btn:disabled{opacity:.55;cursor:not-allowed}.primary{background:var(--blue);color:#fff}.green{background:var(--green);color:#fff}.red{background:var(--red);color:#fff}.ghost{background:#fff;border:1px solid var(--line)}.small{padding:6px 8px;font-size:11px}
.card{background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);overflow:hidden}.card-head{padding:12px 14px;color:#fff;font-weight:900}.card-body{padding:14px}.blueh{background:var(--blue)}.greenh{background:var(--green)}.redh{background:var(--red)}.orangeh{background:var(--orange)}.purpleh{background:var(--purple)}.grayh{background:#596779}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.kpi{background:#fff;border:1px solid var(--line);border-radius:8px;padding:13px;box-shadow:var(--shadow)}.kpi small{font-size:9px;color:var(--muted);text-transform:uppercase;font-weight:900}.kpi b{display:block;font-size:25px;margin-top:5px}.progress{height:8px;background:#e9edf3;border-radius:99px;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;background:var(--green)}.tiny{font-size:10px;color:var(--muted)}.section-title{margin:0 0 6px;font-size:20px}.subhead{font-size:12px;color:var(--muted);margin:0 0 12px}
.table-wrap{overflow:auto}table.data{width:100%;border-collapse:collapse}table.data th,table.data td{padding:8px;border-bottom:1px solid var(--line);font-size:11px;text-align:left;white-space:nowrap}table.data th{font-size:9px;text-transform:uppercase;color:var(--muted);background:#f8fafc}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:12px}.toolbar label{font-size:10px;font-weight:900;color:#5e6c80}.toolbar input,.toolbar select{display:block;margin-top:4px;border:1px solid var(--line);border-radius:6px;padding:8px;background:#fff}.form{display:grid;gap:10px}.form label{font-size:10px;font-weight:900;color:#5e6c80}.form input,.form select,.form textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:9px}.four{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tabs button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:8px 10px;font-size:11px;font-weight:800}.tabs button.active{background:var(--blue);color:#fff}
.chart{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px}.chart-title{font-size:11px;font-weight:900;color:#44536a;margin-bottom:8px}.bar-row{display:grid;grid-template-columns:140px 1fr 45px;gap:8px;align-items:center;font-size:10px;margin:7px 0}.bar-track{height:12px;background:#edf1f6;border-radius:99px;overflow:hidden}.bar-fill{height:100%;background:var(--blue)}.bar-fill.proj{background:var(--orange)}
.note{padding:10px;border-radius:6px;background:#f6f8fb;color:#627084;font-size:11px;line-height:1.45}.stop{color:var(--red);font-weight:900}
.invoice,.report-paper{background:#fff;border:1px solid var(--line);border-radius:8px;padding:18px}.doc-head{display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid #153b70;padding-bottom:12px;margin-bottom:12px}.doc-head img{width:115px}.doc-head h2{margin:0;color:#153b70}.doc-meta{font-size:11px;color:var(--muted);text-align:right}.invoice table{width:100%;border-collapse:collapse}.invoice th,.invoice td{padding:9px;border-bottom:1px solid var(--line);font-size:11px;text-align:right}.invoice th:first-child,.invoice td:first-child{text-align:left}.invoice-total{display:flex;justify-content:flex-end;gap:20px;font-weight:900;padding-top:12px}.invoice-total span:last-child{font-size:20px;color:var(--green)}.doc-footer{font-size:9px;color:var(--muted);margin-top:15px;border-top:1px solid var(--line);padding-top:7px}
.mission-item{display:grid;grid-template-columns:30px 1fr 18px;gap:9px;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line);background:#fff;padding:9px 2px;text-align:left}.mission-icon{width:27px;height:27px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:900}.mission-item b{font-size:11px;color:var(--green)}.mission-item small{display:block;color:var(--muted);margin-top:2px}
.toast{position:fixed;right:18px;bottom:18px;background:#0d2c50;color:#fff;border-radius:7px;padding:11px 14px;display:none;z-index:99;font-size:12px}.toast.show{display:block}dialog{width:min(690px,92vw);border:0;border-radius:10px;padding:0;box-shadow:0 30px 80px rgba(0,0,0,.35)}dialog::backdrop{background:rgba(0,0,0,.6)}.dialog-in{padding:24px}.dialog-close{position:absolute;right:10px;top:7px;border:0;background:none;font-size:26px}

.client-boxes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}.client-box{border:1px solid var(--line);border-radius:7px;padding:9px;background:#fbfcfe}.client-box small{display:block;color:var(--muted);font-size:9px;text-transform:uppercase}.client-box b{font-size:13px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal-head{font-size:9px;font-weight:900;color:var(--muted);text-align:center}.cal-day{border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px;min-height:72px;text-align:left}.cal-day:hover{border-color:var(--blue)}.cal-day.empty{visibility:hidden}.cal-date{font-size:11px;font-weight:900}.cal-meta{font-size:9px;color:var(--muted);margin-top:6px}.cal-day.has-entry{background:#f0f8ff}.cal-day.today{outline:2px solid var(--orange)}
@media(max-width:1100px){.grid2,.grid3{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(3,1fr)}.four{grid-template-columns:1fr 1fr}}
@media(max-width:760px){.sidebar{position:static;width:100%;height:auto}.main{margin-left:0}.kpis{grid-template-columns:1fr 1fr}.four{grid-template-columns:1fr}}
@media print{body{background:#fff}.sidebar,.topbar,.no-print,.toast,dialog{display:none!important}.main{margin:0}.content{padding:0}.content>*{display:none!important}.print-target{display:block!important}.print-target .table-wrap{overflow:visible!important}.print-target table{font-size:9px!important}.print-target th,.print-target td{padding:5px 4px!important}.print-target .tiny{font-size:7px!important}@page{margin:.4in;size:landscape}}
.two{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.mission-flow{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px}
.mission-step-circle{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:transparent;min-width:70px}
.mission-circle-icon{width:38px;height:38px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:16px}
.mission-step-circle small{font-size:9px;font-weight:900;color:var(--green);text-align:center}
.mission-arrow{color:var(--muted);font-size:16px}
.rank-badge{display:inline-block;background:var(--muted);color:#fff;border-radius:99px;padding:1px 8px;font-size:10px;font-weight:900;margin-right:4px}
.rank-first{background:var(--red)}
.goal-input{width:64px}
canvas{width:100%;display:block}
.goal-line{font-size:13px;font-weight:800;color:var(--ink);margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.goal-line b{font-size:28px;color:var(--red);margin:0 4px}
.metric-table{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
.metric-table th,.metric-table td{padding:9px 6px;text-align:center;border-bottom:1px solid var(--line);vertical-align:middle;word-break:break-word}
.metric-table th{font-size:9px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:900;white-space:nowrap;background:#f8fafc}
.metric-table th:first-child,.metric-table td:first-child{text-align:left;font-weight:700}
.metric-table tbody tr:nth-child(even){background:#fafbfd}
.metric-table tbody tr:last-child{background:#f3f6fa;font-weight:800}
.num{font-size:15px;font-weight:900;color:var(--blue2)}
.rednum{color:var(--red)}
.status-pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:9px;font-weight:900;letter-spacing:.02em;white-space:nowrap}
.status-good{background:#e6f7ee;color:var(--green)}
.status-warn{background:#fff2e0;color:#a15c00}

.person{border:1px solid var(--line);border-radius:8px;margin-bottom:10px;overflow:hidden}
.person:last-child{margin-bottom:0}
.person h3{margin:0;padding:9px 12px;font-size:12px;font-weight:900;color:var(--blue2);background:#f4f8fd;border-bottom:1px solid var(--line)}
.stats{display:grid;grid-template-columns:repeat(4,1fr)}
.stats div{padding:10px 4px;text-align:center;border-right:1px solid var(--line)}
.stats div:last-child{border-right:0}
.stats small{display:block;font-size:8px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:800;margin-bottom:3px}
.stats b{font-size:18px;color:var(--ink)}

.rule{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:12px}
.rule:last-child{border-bottom:0;padding-top:12px;margin-top:2px;border-top:2px solid var(--ink)}
.rule span:first-child{color:var(--ink)}
.rule b{color:var(--green);font-size:13px}

.beat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.beat > div{padding:10px 6px;background:#faf7fe;border-radius:8px;font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.02em}
.beat strong{display:block;font-size:26px;color:var(--purple);margin-top:6px;font-weight:900}
.beat-message{grid-column:1/-1;padding-top:12px;margin-top:4px;border-top:1px solid var(--line);color:var(--purple);font-weight:900;font-size:13px;text-align:center}

.trust{padding:6px 4px;text-align:center}
.trust .heart{font-size:38px;color:var(--red);line-height:1}
.trust h2{font-size:18px;margin:8px 0 4px;color:var(--ink)}
.trust h2 span{color:var(--green)}
.trust p{font-size:12px;color:var(--muted);line-height:1.55;margin:6px 0 0}


</style>
</head>

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>"$"+Number(n||0).toFixed(2);
const pct=(a,b)=>b?Math.round((Number(a)||0)/(Number(b)||0)*100):0;
let session=JSON.parse(sessionStorage.getItem("nccbSession")||"null");
let state=null,view="dashboard",periodType="DAILY",adminTab="entries",superTab="reps";
let PROD_CHART_STYLE={actual:"bar",projected:"bar"};
let REPORT_COLUMNS={calls:true,conversations:true,qualified:true,enrollments:true,goalEnr:true,goalPct:true,convPct:true,closePct:true,clients:true,commission:true};
let REPORT_INCLUDE_ITEMIZED=true;

function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2500)}
async function request(action,payload={},withSession=true){const body={action,_ts:Date.now(),...payload};if(withSession)body.token=session?.token||"";const r=await fetch(GOOGLE_APPS_SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)});const d=await r.json();if(!d.ok)throw new Error(d.error||"Request failed");return d}
function applyRoleUI(){document.querySelectorAll(".admin-only").forEach(x=>x.classList.toggle("hidden",!["Admin","SuperAdmin"].includes(session.role)));document.querySelectorAll(".super-only").forEach(x=>x.classList.toggle("hidden",session.role!=="SuperAdmin"));document.querySelectorAll(".rep-only").forEach(x=>x.classList.toggle("hidden",session.role!=="SalesRep"));$("#userName").textContent=session.name;$("#userRole").textContent=session.role}
async function login(e){e.preventDefault();$("#loginMsg").textContent="";try{const d=await request("login",{loginType:$("#loginRole").value,id:$("#loginId").value.trim(),pin:$("#loginPin").value.trim()},false);session={token:d.token,id:d.id,name:d.name,role:d.role};sessionStorage.setItem("nccbSession",JSON.stringify(session));$("#loginPage").classList.add("hidden");$("#appShell").classList.remove("hidden");applyRoleUI();view="dashboard";await load({source:"update",message:"Dashboard loaded."})}catch(err){$("#loginMsg").textContent=err.message}}
function logout(){sessionStorage.removeItem("nccbSession");session=null;state=null;$("#appShell").classList.add("hidden");$("#loginPage").classList.remove("hidden")}
async function load(options={}){
  const message=options.message||"Data updated.";
  const source=options.source||"update";
  const updateBtn=$("#updateBtn"),refreshBtn=$("#refreshBtn"),badge=$("#connectionBadge"),status=$("#syncStatus");
  try{
    if(updateBtn)updateBtn.disabled=true;
    if(refreshBtn)refreshBtn.disabled=true;
    if(badge){badge.textContent="SYNCING";badge.classList.add("syncing");badge.classList.remove("synced")}
    if(status)status.textContent=source==="refresh"?"Refreshing from Google Sheets…":"Updating from Google Sheets…";
    state=await request("bootstrap",{date:$("#workDate").value,periodType,forceRefresh:true});
    render();
    const now=new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit",second:"2-digit"});
    if(badge){badge.textContent="CONNECTED";badge.classList.remove("syncing");badge.classList.add("synced")}
    if(status)status.textContent=(source==="refresh"?"Refresh complete":"Update complete")+" • "+now;
    toast(message);
  }catch(e){
    if(badge){badge.textContent="CONNECTION ERROR";badge.classList.remove("syncing","synced")}
    if(status)status.textContent="Sync failed";
    toast(e.message);
    if(/session/i.test(e.message))logout();
  }finally{
    if(updateBtn)updateBtn.disabled=false;
    if(refreshBtn)refreshBtn.disabled=false;
  }
}
function card(title,body,color="blueh"){return `<section class="card"><div class="card-head ${color}">${title}</div><div class="card-body">${body}</div></section>`}
function kpiCards(m,g){const a=[["Calls",m.calls,g.calls],["Conversations",m.conversations,g.conversations],["Qualified",m.qualified,g.qualified],["Enrollments",m.enrollments,g.enrollments],["Enrollment Goal %",pct(m.enrollments,g.enrollments),100]];return `<div class="kpis">${a.map(x=>`<div class="kpi"><small>${x[0]}</small><b>${x[0].includes("%")?x[1]+"%":x[1]}</b><div class="tiny">Goal: ${x[2]||0}</div><div class="progress"><i style="width:${Math.min(100,pct(x[1],x[2]||1))}%"></i></div></div>`).join("")}</div>`}
function productionTable(rows){return `<div class="table-wrap"><table class="data"><thead><tr><th>Rep</th><th>Calls (A/P)</th><th>Conv. (A/P)</th><th>Qual. (A/P)</th><th>Enr. (A/P)</th><th>Goal Enr.</th><th>Goal %</th><th>Conv. %</th><th>Close %</th><th>Clients</th><th>Commission</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc(r.name)}</b><div class="tiny">${esc(r.id)}</div></td><td>${r.actual.calls}/${r.projected.calls}</td><td>${r.actual.conversations}/${r.projected.conversations}</td><td>${r.actual.qualified}/${r.projected.qualified}</td><td><b>${r.actual.enrollments}</b>/${r.projected.enrollments}</td><td>${r.goals.enrollments}</td><td>${pct(r.actual.enrollments,r.goals.enrollments)}%</td><td>${(r.conversionRate||0).toFixed(1)}%</td><td>${(r.closeRate||0).toFixed(1)}%</td><td>${r.clientCount||0}</td><td><b>${money(r.commission||0)}</b></td></tr>`).join("")}${rows.length>1?`<tr><td><b>TEAM TOTAL</b></td><td><b>${rows.reduce((s,r)=>s+r.actual.calls,0)}</b>/${rows.reduce((s,r)=>s+r.projected.calls,0)}</td><td><b>${rows.reduce((s,r)=>s+r.actual.conversations,0)}</b>/${rows.reduce((s,r)=>s+r.projected.conversations,0)}</td><td><b>${rows.reduce((s,r)=>s+r.actual.qualified,0)}</b>/${rows.reduce((s,r)=>s+r.projected.qualified,0)}</td><td><b>${rows.reduce((s,r)=>s+r.actual.enrollments,0)}</b>/${rows.reduce((s,r)=>s+r.projected.enrollments,0)}</td><td><b>${rows.reduce((s,r)=>s+r.goals.enrollments,0)}</b></td><td>—</td><td>—</td><td>—</td><td><b>${rows.reduce((s,r)=>s+(r.clientCount||0),0)}</b></td><td><b>${money(rows.reduce((s,r)=>s+(r.commission||0),0))}</b></td></tr>`:""}</tbody></table></div>`}
function chartCard(title,canvasId,kind){
 return `<section class="card"><div class="card-head blueh">${esc(title)}</div><div class="card-body">
 <label style="font-size:10px;font-weight:900;color:#5d6c80">Chart style

   <option value="bar" ${PROD_CHART_STYLE[kind]==="bar"?"selected":""}>Bar</option>
   <option value="line" ${PROD_CHART_STYLE[kind]==="line"?"selected":""}>Line</option>
   <option value="pie" ${PROD_CHART_STYLE[kind]==="pie"?"selected":""}>Pie</option>
 </select></label>

}

function metricChartCard(title,canvasId,styleKey){
 if(!(styleKey in PROD_CHART_STYLE))PROD_CHART_STYLE[styleKey]="bar";
 return `<section class="card"><div class="card-head greenh">${esc(title)}</div><div class="card-body">

const CHART_PALETTE=["#1e68c9","#168044","#ef7100","#6240a5","#c91e28","#0b66c8","#8c8c8c"];

function drawBarChart_(canvasId,labels,data,color){
 const canvas=document.getElementById(canvasId);if(!canvas)return;
 const dpr=window.devicePixelRatio||1,cssW=canvas.clientWidth||320,cssH=220;
 canvas.width=cssW*dpr;canvas.height=cssH*dpr;canvas.style.width=cssW+"px";canvas.style.height=cssH+"px";
 const ctx=canvas.getContext("2d");ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,cssW,cssH);
 const pad={top:14,right:10,bottom:34,left:34},chartW=cssW-pad.left-pad.right,chartH=cssH-pad.top-pad.bottom;
 const max=Math.max.apply(null,data.concat([1]))*1.2;
 ctx.strokeStyle="#dce3eb";ctx.beginPath();ctx.moveTo(pad.left,pad.top);ctx.lineTo(pad.left,pad.top+chartH);ctx.lineTo(pad.left+chartW,pad.top+chartH);ctx.stroke();
 const n=Math.max(labels.length,1),groupW=chartW/n,barW=Math.max(groupW-10,6);
 ctx.font="10px Arial";
 data.forEach((v,i)=>{
   const x=pad.left+i*groupW+(groupW-barW)/2,h=(v/max)*chartH,y=pad.top+chartH-h;
   ctx.fillStyle=color;ctx.fillRect(x,y,barW,h);
   ctx.fillStyle="#333";ctx.textAlign="center";ctx.fillText(String(v),x+barW/2,y-4);
 });
 ctx.fillStyle="#68758a";ctx.textAlign="center";
 labels.forEach((l,i)=>{const x=pad.left+i*groupW+groupW/2,txt=l.length>10?l.slice(0,9)+"…":l;ctx.fillText(txt,x,pad.top+chartH+14);});
}

function drawLineChart_(canvasId,labels,data,color){
 const canvas=document.getElementById(canvasId);if(!canvas)return;
 const dpr=window.devicePixelRatio||1,cssW=canvas.clientWidth||320,cssH=220;
 canvas.width=cssW*dpr;canvas.height=cssH*dpr;canvas.style.width=cssW+"px";canvas.style.height=cssH+"px";
 const ctx=canvas.getContext("2d");ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,cssW,cssH);
 const pad={top:14,right:10,bottom:30,left:34},chartW=cssW-pad.left-pad.right,chartH=cssH-pad.top-pad.bottom;
 const max=Math.max.apply(null,data.concat([1]))*1.2,n=Math.max(labels.length-1,1);
 ctx.strokeStyle="#dce3eb";ctx.beginPath();ctx.moveTo(pad.left,pad.top);ctx.lineTo(pad.left,pad.top+chartH);ctx.lineTo(pad.left+chartW,pad.top+chartH);ctx.stroke();
 ctx.strokeStyle=color;ctx.lineWidth=2;ctx.beginPath();
 data.forEach((v,i)=>{const x=pad.left+(i/n)*chartW,y=pad.top+chartH-(v/max)*chartH;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});
 ctx.stroke();
 ctx.fillStyle=color;
 data.forEach((v,i)=>{const x=pad.left+(i/n)*chartW,y=pad.top+chartH-(v/max)*chartH;ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fill();});
 ctx.fillStyle="#68758a";ctx.font="10px Arial";ctx.textAlign="center";
 labels.forEach((l,i)=>{const x=pad.left+(i/n)*chartW,txt=l.length>10?l.slice(0,9)+"…":l;ctx.fillText(txt,x,pad.top+chartH+14);});
}

function drawPieChart_(canvasId,labels,data,colors){
 const canvas=document.getElementById(canvasId);if(!canvas)return;
 const dpr=window.devicePixelRatio||1,cssW=canvas.clientWidth||320,cssH=240;
 canvas.width=cssW*dpr;canvas.height=cssH*dpr;canvas.style.width=cssW+"px";canvas.style.height=cssH+"px";
 const ctx=canvas.getContext("2d");ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,cssW,cssH);
 const total=data.reduce((a,b)=>a+b,0),cx=cssW/2,cy=cssH/2-14,r=Math.min(cx,cy)-18;
 if(total<=0){ctx.fillStyle="#68758a";ctx.textAlign="center";ctx.font="12px Arial";ctx.fillText("No data yet",cx,cy);return;}
 let angle=-Math.PI/2;ctx.font="10px Arial";
 data.forEach((v,i)=>{
   const slice=(v/total)*Math.PI*2;
   ctx.fillStyle=colors[i%colors.length];ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,angle,angle+slice);ctx.closePath();ctx.fill();
   if(v>0){const mid=angle+slice/2;ctx.fillStyle="#fff";ctx.textAlign="center";ctx.fillText(Math.round(v/total*100)+"%",cx+Math.cos(mid)*r*0.62,cy+Math.sin(mid)*r*0.62);}
   angle+=slice;
 });
 let lx=8,ly=cssH-8;ctx.textAlign="left";
 labels.forEach((l,i)=>{
   ctx.fillStyle=colors[i%colors.length];ctx.fillRect(lx,ly-8,10,10);
   ctx.fillStyle="#333";const txt=l.length>12?l.slice(0,11)+"…":l;ctx.fillText(txt,lx+13,ly);
   lx+=ctx.measureText(txt).width+30;if(lx>cssW-50){lx=8;ly+=14;}
 });
}

function drawProductionCharts(){
 if(!state?.global?.rows)return;
 const labels=state.global.rows.map(r=>r.name);
 ["actual","projected"].forEach(kind=>{
   const data=state.global.rows.map(r=>Number(r[kind].enrollments)||0);
   const style=PROD_CHART_STYLE[kind],canvasId="chart-"+kind,color=kind==="projected"?"#ef7100":"#1e68c9";
   if(style==="pie")drawPieChart_(canvasId,labels,data,CHART_PALETTE);
   else if(style==="line")drawLineChart_(canvasId,labels,data,color);
   else drawBarChart_(canvasId,labels,data,color);
 });
}

function drawKpiCharts(){
 if(!state?.global?.rows)return;
 const labels=state.global.rows.map(r=>r.name);
 [["calls","kpiCalls","#1e68c9"],["conversations","kpiConversations","#168044"],["qualified","kpiQualified","#6240a5"],["enrollments","kpiEnrollments","#ef7100"]].forEach(([metric,styleKey,color])=>{
   const data=state.global.rows.map(r=>Number(r.actual[metric])||0);
   const style=PROD_CHART_STYLE[styleKey]||"bar",canvasId="chart-"+styleKey;
   if(style==="pie")drawPieChart_(canvasId,labels,data,CHART_PALETTE);
   else if(style==="line")drawLineChart_(canvasId,labels,data,color);
   else drawBarChart_(canvasId,labels,data,color);
 });
}

function calendarHtml(c){
 const heads=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(x=>`<div class="cal-head">${x}</div>`).join("");
 const blanks=Array(c.firstDow).fill(0).map(()=>'<button class="cal-day empty"></button>').join("");
 const days=Array.from({length:c.daysInMonth},(_,i)=>i+1).map(day=>{
   const key=c.year+"-"+String(c.month).padStart(2,"0")+"-"+String(day).padStart(2,"0"),e=c.entries[key];
   const meta=e?`C ${e.actual.calls}/${e.projected.calls} • Q ${e.actual.qualified}/${e.projected.qualified}<br>Enr ${e.actual.enrollments}/${e.projected.enrollments}`:"Add / Update";
   return `<button class="cal-day ${e?"has-entry":""} ${key===c.today?"today":""}" data-cal-date="${key}"><div class="cal-date">${day}</div><div class="cal-meta">${meta}</div></button>`;
 }).join("");
 const weekRows=(c.weekTotals||[]).map((w,i)=>`<tr><td>Week ${i+1} (${w.start} to ${w.end})</td><td>${w.actual.calls}/${w.projected.calls}</td><td>${w.actual.conversations}/${w.projected.conversations}</td><td>${w.actual.qualified}/${w.projected.qualified}</td><td>${w.actual.enrollments}/${w.projected.enrollments}</td></tr>`).join("");
 const mt=c.monthTotals||{actual:{calls:0,conversations:0,qualified:0,enrollments:0},projected:{calls:0,conversations:0,qualified:0,enrollments:0}};
 const monthLabel=new Date(c.year,c.month-1,1).toLocaleDateString(undefined,{month:"long",year:"numeric"});
 return `<div class="two" style="margin-bottom:8px;align-items:center"><button class="btn ghost small" data-cal-prev type="button">‹ Prev Month</button><b style="text-align:center">${monthLabel}</b><button class="btn ghost small" data-cal-next type="button">Next Month ›</button></div>
 <div class="calendar">${heads}${blanks}${days}</div>
 <p class="tiny" style="margin-top:10px">Each day shows Actual/Projected. Click a day to open and edit that date. Rollups below combine every day in this month.</p>
 <div class="table-wrap"><table class="data"><thead><tr><th>Period</th><th>Calls (A/P)</th><th>Conversations (A/P)</th><th>Qualified (A/P)</th><th>Enrollments (A/P)</th></tr></thead><tbody>
 ${weekRows}
 <tr><td><b>Month Total</b></td><td><b>${mt.actual.calls}/${mt.projected.calls}</b></td><td><b>${mt.actual.conversations}/${mt.projected.conversations}</b></td><td><b>${mt.actual.qualified}/${mt.projected.qualified}</b></td><td><b>${mt.actual.enrollments}/${mt.projected.enrollments}</b></td></tr>
 </tbody></table></div>`;
}

function reportSummaryTable_(rows){
 const cols=REPORT_COLUMNS;
 const heads=[["Rep",true]];
 if(cols.calls)heads.push(["Calls (A/P)",true]);
 if(cols.conversations)heads.push(["Conv. (A/P)",true]);
 if(cols.qualified)heads.push(["Qual. (A/P)",true]);
 if(cols.enrollments)heads.push(["Enr. (A/P)",true]);
 if(cols.goalEnr)heads.push(["Goal Enr.",true]);
 if(cols.goalPct)heads.push(["Goal %",true]);
 if(cols.convPct)heads.push(["Conv. %",true]);
 if(cols.closePct)heads.push(["Close %",true]);
 if(cols.clients)heads.push(["Clients",true]);
 if(cols.commission)heads.push(["Commission",true]);
 const rowHtml=r=>{
   let tds=`<td><b>${esc(r.name)}</b><div class="tiny">${esc(r.id)}</div></td>`;
   if(cols.calls)tds+=`<td>${r.actual.calls}/${r.projected.calls}</td>`;
   if(cols.conversations)tds+=`<td>${r.actual.conversations}/${r.projected.conversations}</td>`;
   if(cols.qualified)tds+=`<td>${r.actual.qualified}/${r.projected.qualified}</td>`;
   if(cols.enrollments)tds+=`<td><b>${r.actual.enrollments}</b>/${r.projected.enrollments}</td>`;
   if(cols.goalEnr)tds+=`<td>${r.goals.enrollments}</td>`;
   if(cols.goalPct)tds+=`<td>${pct(r.actual.enrollments,r.goals.enrollments)}%</td>`;
   if(cols.convPct)tds+=`<td>${(r.conversionRate||0).toFixed(1)}%</td>`;
   if(cols.closePct)tds+=`<td>${(r.closeRate||0).toFixed(1)}%</td>`;
   if(cols.clients)tds+=`<td>${r.clientCount||0}</td>`;
   if(cols.commission)tds+=`<td><b>${money(r.commission||0)}</b></td>`;
   return `<tr>${tds}</tr>`;
 };
 let totalRow="";
 if(rows.length>1){
   let tds=`<td><b>TEAM TOTAL</b></td>`;
   if(cols.calls)tds+=`<td><b>${rows.reduce((s,r)=>s+r.actual.calls,0)}</b>/${rows.reduce((s,r)=>s+r.projected.calls,0)}</td>`;
   if(cols.conversations)tds+=`<td><b>${rows.reduce((s,r)=>s+r.actual.conversations,0)}</b>/${rows.reduce((s,r)=>s+r.projected.conversations,0)}</td>`;
   if(cols.qualified)tds+=`<td><b>${rows.reduce((s,r)=>s+r.actual.qualified,0)}</b>/${rows.reduce((s,r)=>s+r.projected.qualified,0)}</td>`;
   if(cols.enrollments)tds+=`<td><b>${rows.reduce((s,r)=>s+r.actual.enrollments,0)}</b>/${rows.reduce((s,r)=>s+r.projected.enrollments,0)}</td>`;
   if(cols.goalEnr)tds+=`<td><b>${rows.reduce((s,r)=>s+r.goals.enrollments,0)}</b></td>`;
   if(cols.goalPct)tds+="<td>—</td>";
   if(cols.convPct)tds+="<td>—</td>";
   if(cols.closePct)tds+="<td>—</td>";
   if(cols.clients)tds+=`<td><b>${rows.reduce((s,r)=>s+(r.clientCount||0),0)}</b></td>`;
   if(cols.commission)tds+=`<td><b>${money(rows.reduce((s,r)=>s+(r.commission||0),0))}</b></td>`;
   totalRow=`<tr>${tds}</tr>`;
 }
 return `<div class="table-wrap"><table class="data"><thead><tr>${heads.map(h=>`<th>${esc(h[0])}</th>`).join("")}</tr></thead><tbody>${rows.map(rowHtml).join("")}${totalRow}</tbody></table></div>`;
}
function itemizedSalesTable_(lines,multiRep){

 const rowsHtml=lines.map(l=>`<tr>${multiRep?`<td>${esc(l.repName)}</td>`:""}<td>${esc(l.firstName)} ${esc(l.lastName)}</td><td>${esc(l.service)}</td><td>${esc(l.date)}</td><td>${money(l.rate)}</td><td><b>${money(l.amount)}</b></td></tr>`).join("");

 return `<div class="table-wrap"><table class="data"><thead><tr>${multiRep?"<th>Rep</th>":""}<th>Client</th><th>Service</th><th>Date</th><th>Rate</th><th>Commission</th></tr></thead><tbody>${rowsHtml}<tr><td colspan="${multiRep?5:4}"><b>TOTAL</b></td><td><b>${money(total)}</b></td></tr></tbody></table></div>`;
}

function adminView(){if(!["Admin","SuperAdmin"].includes(session.role))return `<div class="note">Admin access required.</div>`;const tabs=[["entries","All Entries"],["goals","Rep Goals"],["corrections","Corrections"],["commissions","Commission Rules"],["content","Content Library"],["reports","Report Log"]];return `<h2 class="section-title">Admin Backend</h2><p class="subhead">Global administrative access to all production data, goals, corrections, commissions and reporting.</p><div class="tabs">${tabs.map(t=>`<button data-admin-tab="${t[0]}" class="${adminTab===t[0]?"active":""}">${t[1]}</button>`).join("")}</div>${adminContent()}`}

 if(adminTab==="commissions")return card("COMMISSION RULES",`<div class="note" style="margin-bottom:10px"><b>Fixed at exactly four NCCB services</b> — Credit Counseling, Credit Restoration, Debt Management, Debt Settlement. Admin may adjust rate and active status only; services cannot be renamed, duplicated, or added to.</div><div class="table-wrap"><table class="data"><thead><tr><th>Service Type</th><th>Rate Per Enrolled Client</th><th>Active</th></tr></thead><tbody id="commissionRuleBody">${state.admin.commissionRules.map((r,i)=>`<tr><td><input data-cr="${i}" data-f="service" value="${esc(r.service)}" readonly></td><td><input data-cr="${i}" data-f="rate" type="number" step=".01" min="0" value="${r.rate}"></td><td><select data-cr="${i}" data-f="active"><option value="TRUE" ${r.active?"selected":""}>TRUE</option><option value="FALSE" ${!r.active?"selected":""}>FALSE</option></select></td></tr>`).join("")}</tbody></table></div><div class="two" style="margin-top:10px"><button class="btn green" data-action="save-commission-rules">Save Rules</button></div>`,"greenh")+card("COMMISSION BY REP — "+esc(periodType),`<div class="note" style="margin-bottom:10px">Computed live from each rep's enrolled clients for the selected period. This is the same math behind each rep's own statement, run for everyone.</div><div class="table-wrap"><table class="data"><thead><tr><th>Rep</th><th>Clients</th><th>Total Commission</th></tr></thead><tbody>${(state.admin.commissionByRep||[]).map(r=>`<tr><td>${esc(r.repName)} (${esc(r.repId)})</td><td>${r.clientCount}</td><td>${money(r.total)}</td></tr>`).join("")}${(state.admin.commissionByRep||[]).length?`<tr><td><b>Team Total</b></td><td><b>${(state.admin.commissionByRep||[]).reduce((s,r)=>s+r.clientCount,0)}</b></td><td><b>${money((state.admin.commissionByRep||[]).reduce((s,r)=>s+r.total,0))}</b></td></tr>`:'<tr><td colspan="3">No active reps found.</td></tr>'}</tbody></table></div>`,"blueh");

function render(){if(!state)return;$("#dateText").textContent=new Date($("#workDate").value+"T12:00:00").toLocaleDateString(undefined,{weekday:"long",year:"numeric",month:"long",day:"numeric"});let html="";switch(view){case"dashboard":html=dashboardView();break;case"production":html=productionView();break;case"entry":html=entryView();break;case"goals":html=goalsView();break;case"kpi":html=kpiView();break;case"commission":html=commissionView();break;case"reports":html=reportsView();break;case"mission":html=missionView();break;case"admin":html=adminView();break;case"superadmin":html=superAdminView();break;default:html=dashboardView();}$("#content").innerHTML=html;bind();if(view==="production")drawProductionCharts();if(view==="kpi")drawKpiCharts();}
function bind(){
 document.querySelector("[data-action=change-period]")?.addEventListener("click",async()=>{periodType=$("#periodSelect").value;await load();});
 document.querySelectorAll("[data-chart-style-select]").forEach(sel=>sel.addEventListener("change",()=>{PROD_CHART_STYLE[sel.dataset.chartStyleSelect]=sel.value;if(view==="production")drawProductionCharts();else if(view==="kpi")drawKpiCharts();}));
 document.querySelector("#periodSelect")?.addEventListener("change",async()=>{periodType=$("#periodSelect").value;await load();});
 document.querySelectorAll("[data-cal-date]").forEach(b=>b.addEventListener("click",async()=>{$("#workDate").value=b.dataset.calDate;view="entry";await load({source:"update",message:"Loaded "+b.dataset.calDate+"."})}));
 document.querySelector("[data-cal-prev]")?.addEventListener("click",async()=>{shiftCalendarMonth(-1);await load()});
 document.querySelector("[data-cal-next]")?.addEventListener("click",async()=>{shiftCalendarMonth(1);await load()});
 document.querySelector("[data-action=save-production]")?.addEventListener("click",()=>saveProduction(false));
 document.querySelectorAll(".autosave-field").forEach(i=>i.addEventListener("input",scheduleAutosave_));document.querySelector("[data-action=add-client]")?.addEventListener("click",addClient);
 document.querySelectorAll("[data-save-goal]").forEach(b=>b.addEventListener("click",()=>saveGoal(b.dataset.saveGoal)));
 document.querySelectorAll("[data-mission]").forEach(b=>b.addEventListener("click",()=>openMission(+b.dataset.mission)));
 document.querySelectorAll("[data-action=print]").forEach(b=>b.addEventListener("click",()=>window.print()));
 document.querySelector("[data-action=generate-report]")?.addEventListener("click",generateReport);
 document.querySelectorAll("[data-report-col]").forEach(cb=>cb.addEventListener("change",()=>{REPORT_COLUMNS[cb.dataset.reportCol]=cb.checked;if(state.report)render();}));
 document.querySelector("#reportIncludeItemized")?.addEventListener("change",(e)=>{REPORT_INCLUDE_ITEMIZED=e.target.checked;if(state.report)render();});

let autosaveTimer_=null;
function scheduleAutosave_(){
 const status=document.getElementById("autosaveStatus");
 if(status)status.textContent="Typing… will auto-save in a moment.";
 if(autosaveTimer_)clearTimeout(autosaveTimer_);
 autosaveTimer_=setTimeout(async()=>{
   const status2=document.getElementById("autosaveStatus");
   if(status2)status2.textContent="Auto-saving…";
   try{
     await saveProduction(true);
     const status3=document.getElementById("autosaveStatus");
     if(status3)status3.textContent="Auto-saved at "+new Date().toLocaleTimeString();
   }catch(e){
     const status4=document.getElementById("autosaveStatus");
     if(status4)status4.textContent="Auto-save failed: "+e.message;
   }
 },2500);
}

async function saveProduction(silent){
 const a={calls:+$("#a_calls").value||0,conversations:+$("#a_conversations").value||0,qualified:+$("#a_qualified").value||0},
   p={calls:+$("#p_calls").value||0,conversations:+$("#p_conversations").value||0,qualified:+$("#p_qualified").value||0,enrollments:+$("#p_enrollments").value||0};
 try{
   await request("saveProductionNumbers",{entry:{date:$("#workDate").value,actual:a,projected:p}});
   if(!silent)await load({source:"update",message:"Production numbers saved."});
 }catch(e){
   if(!silent)toast(e.message);
   throw e;
 }
}

async function addClient(){const firstName=$("#clientFirst")?.value.trim()||"",lastName=$("#clientLast")?.value.trim()||"",service=$("#clientService")?.value||"";if(!firstName||!lastName){toast("Enter both client first name and last name.");return}try{await request("addEnrollmentClient",{client:{date:$("#workDate").value,firstName,lastName,service}});$("#clientFirst").value="";$("#clientLast").value="";await load({source:"update",message:"Enrolled client added. Production correction count was not changed."})}catch(e){toast(e.message)}}
async function saveGoal(pt){const g={};document.querySelectorAll(`[data-goal-period="${pt}"]`).forEach(i=>g[i.dataset.goalMetric]=+i.value||0);try{await request("saveRepGoal",{periodType:pt,goals:g,date:$("#workDate").value});await load({source:"update",message:pt+" goals saved and published."})}catch(e){toast(e.message)}}
function openMission(i){const m=state.mission[i];$("#modalBody").innerHTML=`<div class="dialog-in"><h2>${esc(m.title)}</h2><h4>Sales Meaning</h4><p>${esc(m.definition)}</p><h4>Talk Track</h4><p><b>${esc(m.talkTrack)}</b></p><h4>Coaching Points</h4><ul>${m.points.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`;$("#modal").showModal()}
async function editMissionDay(day){
 const dayInfo=state.admin.missionDays.find(d=>d.day===day);
 if(!dayInfo){toast("Day not found.");return}
 const steps=[];
 for(const step of dayInfo.steps){
   const definition=prompt("["+step.title+"] Sales meaning",step.definition);
   if(definition===null)return;
   const talkTrack=prompt("["+step.title+"] Talk track",step.talkTrack);
   if(talkTrack===null)return;
   const points=prompt("["+step.title+"] Coaching points (separate with |)",step.points);
   if(points===null)return;
   steps.push({key:step.key,order:dayInfo.steps.indexOf(step)+1,title:step.title,definition,talkTrack,points});
 }
 try{await request("saveMissionDay",{day,steps});toast("Day "+day+" mission updated.");await load()}catch(e){toast(e.message)}
}
async function editMotivationDay(day){
 const dayInfo=state.admin.motivationDays.find(d=>d.day===day);
 if(!dayInfo){toast("Day not found.");return}
 const headline=prompt("Headline",dayInfo.headline);if(headline===null)return;
 const subheadline=prompt("Subheadline",dayInfo.subheadline);if(subheadline===null)return;
 const body=prompt("Motivation message",dayInfo.body);if(body===null)return;
 try{await request("saveMotivationDay",{day,content:{headline,subheadline,body}});toast("Day "+day+" motivation updated.");await load()}catch(e){toast(e.message)}
}
async function editObjectionDay(day){
 const dayInfo=state.admin.objectionDays.find(d=>d.day===day);

 try{await request("saveObjectionDay",{day,text,tips});toast("Day "+day+" objection updated.");await load()}catch(e){toast(e.message)}

function shiftCalendarMonth(delta){
 const cur=new Date($("#workDate").value+"T12:00:00");
 const next=new Date(cur.getFullYear(),cur.getMonth()+delta,1);
 $("#workDate").value=Utilities_formatDate(next);
}
function Utilities_formatDate(d){
 return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

async function adminCorrect(id){const e=state.admin.entries.find(x=>x.entryId===id);if(!e)return;const c=prompt("Actual calls",e.actual.calls);if(c===null)return;const v=prompt("Actual conversations",e.actual.conversations);if(v===null)return;const q=prompt("Actual qualified",e.actual.qualified);if(q===null)return;const n=prompt("Actual enrollments",e.actual.enrollments);if(n===null)return;try{await request("adminCorrectEntry",{entryId:id,actual:{calls:+c||0,conversations:+v||0,qualified:+q||0,enrollments:+n||0}});await load({source:"update",message:"Admin correction saved and data updated."})}catch(err){toast(err.message)}}
function addServiceRow(){const body=$("#commissionRuleBody");if(!body)return;const i=body.querySelectorAll("tr").length;const tr=document.createElement("tr");tr.innerHTML=`<td><input data-cr="${i}" data-f="service" placeholder="New service type"></td><td><input data-cr="${i}" data-f="rate" type="number" step=".01" min="0" value="0"></td><td><select data-cr="${i}" data-f="active"><option value="TRUE">TRUE</option><option value="FALSE">FALSE</option></select></td>`;body.appendChild(tr)}

(async()=>{
  // --- SSO auto-login from NCCB Training Solutions ---
  // If ?ssoRole=...&ssoId=...&ssoPin=... is present and no session already
  // exists, call the REAL, existing login action exactly as if typed by
  // hand. Falls through to the normal login screen on any failure or if
  // no SSO params are present -- never touches the existing session-resume
  // check below.
  if(!session){
    const ssoParams=new URLSearchParams(location.search);
    const ssoRole=ssoParams.get("ssoRole"),ssoId=ssoParams.get("ssoId"),ssoPin=ssoParams.get("ssoPin");
    if(ssoRole&&ssoId&&ssoPin){
      try{
        const d=await request("login",{loginType:ssoRole,id:ssoId,pin:ssoPin},false);
        session={token:d.token,id:d.id,name:d.name,role:d.role};
        sessionStorage.setItem("nccbSession",JSON.stringify(session));
      }catch(e){ /* bad/expired SSO creds -- fall through to the normal login screen below */ }
      history.replaceState(null,'',location.pathname); // scrub the PIN out of the visible URL either way
    }
  }
  if(session){$("#loginPage").classList.add("hidden");$("#appShell").classList.remove("hidden");applyRoleUI();await load({source:"update",message:"Dashboard loaded."})}
})();
</script>
