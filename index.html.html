<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NCCB Sales Team Command Center</title>
<style>
:root{
  --nav:#071b35;--blue:#1454a3;--blue2:#1e68c9;--red:#c91e28;--green:#168044;
  --orange:#ef7100;--purple:#6240a5;--ink:#142033;--muted:#66758a;--line:#dce3eb;
  --bg:#f3f6fa;--card:#fff;--shadow:0 10px 28px rgba(17,38,68,.09)
}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
button,input,select,textarea{font:inherit} button{cursor:pointer}
.hidden{display:none!important}
.login-page{min-height:100vh;display:grid;place-items:center;background:#fbf6f1;padding:20px}
.login-card{width:min(430px,94vw);background:#fff;border:2px solid var(--orange);border-radius:11px;padding:28px 24px 32px;box-shadow:0 12px 36px rgba(100,55,10,.08)}
.login-logo{display:block;width:130px;height:auto;margin:0 auto 22px}
.login-card h1{font-size:19px;color:#b55700;margin:0 0 14px;text-align:center;letter-spacing:.2px}
.login-card label{display:block;color:#677180;font-size:13px;margin:12px 0 5px}
.login-card input,.login-card select{width:100%;height:36px;border:1px solid #d4d9df;border-radius:5px;padding:0 10px;background:#fff}
.login-btn{display:block;margin:16px auto 0;border:0;background:var(--orange);color:#fff;border-radius:5px;padding:9px 18px}
.login-msg{min-height:20px;margin-top:12px;text-align:center;font-size:12px;color:var(--red)}

.sidebar{position:fixed;left:0;top:0;bottom:0;width:236px;background:linear-gradient(180deg,#071b35,#06152a);color:#fff;z-index:30;display:flex;flex-direction:column}
.brand{padding:20px;border-bottom:1px solid rgba(255,255,255,.1)} .brand img{width:88px;background:white;border-radius:5px;padding:3px}
.brand b{display:block;color:#fff;margin-top:8px;font-size:12px}
.nav{padding:13px 9px;display:grid;gap:3px} .nav button{text-align:left;border:0;background:transparent;color:#dce7f4;border-radius:7px;padding:11px 12px;font-weight:700}
.nav button.active,.nav button:hover{background:#0b66c8;color:#fff}
.userbox{margin-top:auto;padding:15px;border-top:1px solid rgba(255,255,255,.1);font-size:12px} .userbox small{display:block;color:#a9bbcf;margin-top:4px}
.main{margin-left:236px;min-height:100vh}
.topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:11px 20px;display:flex;justify-content:space-between;align-items:center;gap:14px}
.topbar h1{font-size:20px;margin:0} .topbar p{font-size:11px;color:var(--muted);margin:3px 0 0} .top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.top-actions input{border:1px solid var(--line);border-radius:6px;padding:8px} .badge{font-size:10px;border-radius:99px;padding:6px 8px;font-weight:900;background:#e9f7ef;color:#17653d}
.btn{border:0;border-radius:6px;padding:9px 12px;font-weight:800} .btn.primary{background:var(--blue);color:#fff} .btn.red{background:var(--red);color:#fff} .btn.green{background:var(--green);color:#fff} .btn.ghost{border:1px solid var(--line);background:#fff}
.content{padding:17px 19px 30px} .grid4{display:grid;grid-template-columns:1.15fr .75fr 1fr 1fr;gap:11px} .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px;margin-top:11px} .grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.card{background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);overflow:hidden} .card-head{padding:12px 14px;color:#fff;font-weight:900} .card-body{padding:14px}
.redh{background:var(--red)}.blueh{background:var(--blue2)}.greenh{background:var(--green)}.orangeh{background:var(--orange)}.purpleh{background:var(--purple)}
.metric-table{width:100%;border-collapse:collapse;font-size:12px} .metric-table th,.metric-table td{border:1px solid var(--line);padding:8px 5px;text-align:center} .metric-table th{font-size:9px;background:#f7f9fb;text-transform:uppercase;color:#58687c} .metric-table td:first-child{text-align:left;font-weight:800}
.goal-line{font-size:13px;font-weight:800;margin-bottom:11px} .goal-line b{font-size:30px;color:var(--red)} .num{font-size:19px;font-weight:900;color:var(--blue)} .rednum{color:var(--red)}
.progress{height:10px;background:#e8edf3;border-radius:99px;overflow:hidden;margin-top:10px} .progress i{display:block;height:100%;background:var(--red)} .tiny{font-size:10px;color:var(--muted)}
.beat{display:grid;gap:11px;text-align:center} .beat strong{font-size:28px;color:var(--purple)} .beat-message{border-top:1px solid var(--line);padding-top:13px;color:var(--purple);font-weight:900}
.person{border:1px solid var(--line);border-radius:7px;margin-bottom:9px;overflow:hidden} .person h3{font-size:12px;color:var(--blue);margin:0;padding:8px;background:#f8fbff} .stats{display:grid;grid-template-columns:repeat(4,1fr)} .stats div{padding:8px 4px;text-align:center;border-right:1px solid var(--line)} .stats div:last-child{border-right:0} .stats small{display:block;font-size:8px;color:var(--muted);text-transform:uppercase} .stats b{font-size:19px}
.rule{display:flex;justify-content:space-between;padding:8px 2px;border-bottom:1px solid var(--line);font-size:12px} .rule b{color:var(--green)}
.mission-item{display:grid;grid-template-columns:31px 1fr 18px;gap:9px;align-items:center;width:100%;background:#fff;border:0;border-bottom:1px solid var(--line);padding:9px 2px;text-align:left} .mission-item:hover{background:#f2fbf5} .mission-icon{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:var(--green);color:#fff;font-size:11px;font-weight:900} .mission-item b{font-size:11px;color:var(--green)} .mission-item small{display:block;color:var(--muted);margin-top:2px}
.trust{padding:22px;text-align:center} .trust .heart{font-size:46px;color:var(--red)} .trust h2{font-size:20px} .trust h2 span{color:var(--green)} .trust p{font-size:12px;color:var(--muted);line-height:1.5}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:11px} .kpi{background:#fff;border:1px solid var(--line);border-radius:8px;padding:13px;box-shadow:var(--shadow)} .kpi small{text-transform:uppercase;color:var(--muted);font-size:9px;font-weight:900} .kpi b{display:block;font-size:25px;margin-top:5px}
.section-title{margin:0 0 12px;font-size:20px} .form{display:grid;gap:10px} .form label{font-size:10px;font-weight:900;color:#5d6c80} .form input,.form select,.form textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:9px;background:#fff} .form textarea{min-height:90px}
.table-wrap{overflow:auto} table.data{width:100%;border-collapse:collapse;background:#fff} table.data th,table.data td{padding:9px;border-bottom:1px solid var(--line);font-size:11px;text-align:left} table.data th{font-size:9px;text-transform:uppercase;color:var(--muted);background:#f8fafc}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px} .tabs button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:8px 10px;font-weight:800;font-size:11px} .tabs button.active{background:var(--blue);color:#fff}
.permission-note{padding:10px;border-radius:6px;background:#f6f8fb;color:#627084;font-size:11px;line-height:1.45}
dialog{width:min(680px,92vw);border:0;border-radius:10px;padding:0;box-shadow:0 30px 80px rgba(0,0,0,.35)} dialog::backdrop{background:rgba(0,0,0,.6)} .dialog-in{padding:24px} .dialog-close{position:absolute;right:10px;top:7px;border:0;background:none;font-size:26px}
.toast{position:fixed;right:18px;bottom:18px;background:#0d2c50;color:#fff;padding:11px 14px;border-radius:7px;display:none;z-index:99;font-size:12px} .toast.show{display:block}
@media(max-width:1150px){.grid4{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr 1fr}.kpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:760px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.main{margin-left:0}.grid4,.grid3,.grid2{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}}

/* V2 production / reporting enhancements */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:12px}.toolbar label{font-size:10px;font-weight:900;color:#5e6c80}.toolbar input,.toolbar select{display:block;margin-top:4px;border:1px solid var(--line);border-radius:6px;padding:8px;background:#fff}.chart{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px}.chart-title{font-size:11px;font-weight:900;color:#44536a;margin-bottom:8px}.bars{display:grid;gap:8px}.bar-row{display:grid;grid-template-columns:135px 1fr 48px;gap:8px;align-items:center;font-size:10px}.bar-track{height:12px;background:#edf1f6;border-radius:99px;overflow:hidden}.bar-fill{height:100%;background:var(--blue);border-radius:99px}.bar-fill.green{background:var(--green)}.bar-fill.orange{background:var(--orange)}.invoice{background:#fff;border:1px solid #cfd7e2;border-radius:8px;padding:18px}.invoice-top{display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid #1a3559;padding-bottom:12px;margin-bottom:12px}.invoice-logo{width:115px}.invoice h2{margin:0;color:#153b70}.invoice-meta{text-align:right;font-size:11px;color:var(--muted)}.invoice-table{width:100%;border-collapse:collapse}.invoice-table th,.invoice-table td{padding:9px;border-bottom:1px solid var(--line);font-size:11px;text-align:right}.invoice-table th:first-child,.invoice-table td:first-child{text-align:left}.invoice-total{display:flex;justify-content:flex-end;gap:25px;padding-top:12px;font-weight:900}.invoice-total span:last-child{font-size:20px;color:var(--green)}.report-paper{background:#fff;border:1px solid var(--line);border-radius:8px;padding:18px}.report-header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #153b70;padding-bottom:10px;margin-bottom:12px}.report-header img{width:110px}.report-header h2{margin:0;color:#153b70}.report-footer{font-size:9px;color:var(--muted);margin-top:15px;border-top:1px solid var(--line);padding-top:7px}.subhead{font-size:12px;color:var(--muted);margin:-5px 0 12px}.status-stop{color:var(--red);font-weight:900}.four{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}@media(max-width:1200px){.four{grid-template-columns:1fr 1fr}}@media(max-width:760px){.four{grid-template-columns:1fr}}@media print{body{background:white}.sidebar,.topbar,.no-print,.toast,dialog{display:none!important}.main{margin:0}.content{padding:0}.card,.report-paper,.invoice{box-shadow:none;border:0}#content>*{display:none!important}#content .print-target{display:block!important}.print-target{width:100%!important}@page{margin:.45in}}
</style>
</head>

<script>
/* ================================================================
   CONFIGURATION
   Paste your deployed Google Apps Script Web App URL here.
   ================================================================ */
const GOOGLE_APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyIqJNYlCHktBPeGdLyQNyH64IWUNFpk11C_rT2qmbawbakYm-KO98C69OwBzVDxFvGYg/exec"; // https://script.google.com/macros/s/.../exec

const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = (a,b) => b ? Math.round((Number(a)||0)/(Number(b)||0)*100) : 0;
const money = n => "$"+Number(n||0).toFixed(2);

let session = JSON.parse(sessionStorage.getItem("nccbSession") || "null");
let state = null;
let view = "dashboard";
let adminTab = "kpis";
let superTab = "reps";

function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2500)}

async function gas(action,payload={}){
  if(!GOOGLE_APPS_SCRIPT_URL) throw new Error("GOOGLE_APPS_SCRIPT_URL is blank in index.html.");
  const res=await fetch(GOOGLE_APPS_SCRIPT_URL,{
    method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify({action,token:session?.token||"",...payload})
  });
  const data=await res.json();
  if(!data.ok) throw new Error(data.error||"Request failed");
  return data;
}

function setRoleUI(){
  const role=session?.role||"";
  document.querySelectorAll(".admin-only").forEach(x=>x.classList.toggle("hidden",!(role==="Admin"||role==="SuperAdmin")));
  document.querySelectorAll(".super-only").forEach(x=>x.classList.toggle("hidden",role!=="SuperAdmin"));
  $("#userName").textContent=session?.name||"";
  $("#userRole").textContent=role==="SalesRep" ? "Sales Representative" : role;
}

async function login(e){
  e.preventDefault();
  $("#loginMsg").textContent="";
  try{
    const data=await gasNoSession("login",{
      loginType:$("#loginRole").value,
      id:$("#loginId").value.trim(),
      pin:$("#loginPin").value.trim()
    });
    session={token:data.token,role:data.role,id:data.id,name:data.name};
    sessionStorage.setItem("nccbSession",JSON.stringify(session));
    $("#loginPage").classList.add("hidden");
    $("#appShell").classList.remove("hidden");
    setRoleUI();
    await loadDashboard();
  }catch(err){
    $("#loginMsg").textContent=err && err.message ? err.message : String(err);
    console.error("NCCB login error:",err);
  }
}
async function gasNoSession(action,payload={}){
  if(!GOOGLE_APPS_SCRIPT_URL) throw new Error("Paste the Google Apps Script Web App URL into index.html first.");
  const res=await fetch(GOOGLE_APPS_SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,...payload})});
  const data=await res.json(); if(!data.ok) throw new Error(data.error||"Login failed"); return data;
}

function logout(){sessionStorage.removeItem("nccbSession");session=null;state=null;$("#appShell").classList.add("hidden");$("#loginPage").classList.remove("hidden");$("#loginPin").value="";}

async function loadDashboard(){
  try{
    const data=await gas("dashboard",{date:$("#workDate").value});
    state=data;
    render();
  }catch(err){
    if(/session|unauthorized|expired/i.test(err.message)) logout();
    toast(err.message);
  }
}

function head(title,color,body){return `<section class="card"><div class="card-head ${color}">${title}</div><div class="card-body">${body}</div></section>`}
function challengeCard(){
  const s=state.settings,m=state.metrics,g=Number(s.TEAM_ENROLLMENT_GOAL||6);
  const perGoal=Number(s.REP_ENROLLMENT_GOAL||3);
  return head("🔥 DAILY SALES CHALLENGE","redh",`
  <div class="goal-line">TEAM GOAL: <b>${g}</b> QUALIFIED ENROLLMENTS</div>
  <table class="metric-table"><thead><tr><th>Employee</th><th>Goal</th><th>Actual</th><th>Status</th></tr></thead><tbody>
  ${state.employees.map(e=>`<tr><td>${esc(e.name)}</td><td>${perGoal}</td><td class="num">${e.enrollments}</td><td>${e.enrollments>=perGoal?"ON PACE":"KEEP GOING"}</td></tr>`).join("")}
  <tr><td>TEAM TOTAL</td><td>${g}</td><td class="num rednum">${m.enrollments}</td><td>${m.enrollments>=g?"GOAL HIT":"KEEP PUSHING"}</td></tr></tbody></table>
  <div class="progress"><i style="width:${Math.min(100,pct(m.enrollments,g))}%"></i></div><div class="tiny">${pct(m.enrollments,g)}% complete</div>`)}
function beatCard(){return head("🚀 BEAT YESTERDAY","purpleh",`<div class="beat"><div>YESTERDAY<br><strong>${state.yesterday}</strong></div><div>TODAY<br><strong>${state.metrics.enrollments}</strong></div><div>GOAL<br><strong>${state.settings.TEAM_ENROLLMENT_GOAL||6}</strong></div><div class="beat-message">${state.metrics.enrollments>state.yesterday?"★ YOU BEAT YESTERDAY!":"LET'S BEAT YESTERDAY!"}</div></div>`)}
function scoreCard(){
  return head("▮ DAILY SCOREBOARD","blueh",state.employees.map(e=>`<div class="person"><h3>${esc(e.name)}</h3><div class="stats">
  <div><small>Calls</small><b>${e.calls}</b></div><div><small>Conversations</small><b>${e.conversations}</b></div><div><small>Qualified</small><b>${e.qualified}</b></div><div><small>Enrollments</small><b>${e.enrollments}</b></div>
  </div></div>`).join(""))}
function commissionsCard(){
 return head("💵 COMMISSION / FEES","greenh",state.commissionRules.map(r=>`<div class="rule"><span>${esc(r.service)}</span><span>Commission <b>${money(r.commission)}</b> &nbsp; Fee <b>${money(r.fee)}</b></span></div>`).join(""))}
function missionCard(){
 return head("★ TODAY'S MISSION","greenh",state.mission.map((m,i)=>`<button class="mission-item" data-mission="${i}"><span class="mission-icon">${i+1}</span><span><b>${esc(m.title)}</b><small>${esc(m.definition.slice(0,75))}...</small></span><span>›</span></button>`).join(""))}
function trustCard(){
 return `<section class="card"><div class="trust"><div class="heart">♡</div><h2>${esc(state.trust.headline)}<br><span>${esc(state.trust.subheadline||"EARN THE CLIENT'S TRUST.")}</span></h2><p>${esc(state.trust.body)}</p>${session.role!=="SalesRep"?'<button class="btn red" data-action="edit-trust">Edit Message</button>':""}</div></section>`}
function kpis(){
 const m=state.metrics,s=state.settings;
 const arr=[
 ["TOTAL CALLS",m.calls,s.TEAM_CALL_GOAL],["CONVERSATIONS",m.conversations,s.TEAM_CONVERSATION_GOAL],
 ["QUALIFIED OPPORTUNITIES",m.qualified,s.TEAM_QUALIFIED_GOAL],["ENROLLMENTS",m.enrollments,s.TEAM_ENROLLMENT_GOAL],["GOAL %",pct(m.enrollments,s.TEAM_ENROLLMENT_GOAL),100]
 ];
 return `<div class="kpis">${arr.map(x=>`<div class="kpi"><small>${x[0]}</small><b>${x[0]==="GOAL %"?x[1]+"%":x[1]}</b><div class="tiny">Goal: ${x[2]??"—"}</div></div>`).join("")}</div>`}
function dashboardView(){return `<div class="grid4">${challengeCard()}${beatCard()}${scoreCard()}${commissionsCard()}</div><div class="grid3">${missionCard()}${head("💬 OBJECTION OF THE DAY","orangeh",'<h3 style="text-align:center">“I NEED TO THINK ABOUT IT.”</h3><ul><li>Acknowledge the concern</li><li>Reflect their goals</li><li>Refocus on benefits</li><li>Ask for a decision</li></ul>')}${trustCard()}</div>${kpis()}`}
function scoreboardView(){return `<h2 class="section-title">Team Scoreboard</h2>${scoreCard()}${kpis()}`}
function activityView(){
 const reps=session.role==="SalesRep"?state.employees.filter(e=>String(e.id)===String(session.id)):state.employees;
 return `<h2 class="section-title">Activity Entry</h2><div class="grid2"><section class="card"><div class="card-head blueh">CAPTURE ACTIVITY</div><div class="card-body form">
 <label>REP<select id="actRep">${reps.map(e=>`<option value="${esc(e.id)}">${esc(e.name)}</option>`).join("")}</select></label>
 <label>EVENT<select id="actType"><option>CALL</option><option>CONVERSATION</option><option>QUALIFIED_OPPORTUNITY</option><option>ENROLLMENT</option><option>DMP_CONVERSION</option><option>REFUND</option><option>CANCELLATION</option></select></label>
 <label>QUANTITY<input id="actQty" type="number" value="1" min="1"></label><button class="btn primary" data-action="save-activity">Save</button></div></section><section class="card"><div class="card-head greenh">TODAY'S KPIs</div><div class="card-body">${kpis()}</div></section></div>`}
function missionView(){return `<h2 class="section-title">Today's Mission</h2><div class="grid2">${missionCard()}${trustCard()}</div>`}
function commissionView(){return `<h2 class="section-title">Commission Tracker</h2>${commissionsCard()}`}

function adminView(){
 if(!(session.role==="Admin"||session.role==="SuperAdmin")) return `<div class="permission-note">Admin access required.</div>`;
 const tabs=[["kpis","KPIs & Goals"],["commissions","Commissions & Fees"],["content","Mission & Messaging"],["recognition","Recognition"]];
 return `<h2 class="section-title">Admin Backend</h2><div class="tabs">${tabs.map(t=>`<button data-admin-tab="${t[0]}" class="${adminTab===t[0]?"active":""}">${t[1]}</button>`).join("")}</div>${adminTabContent()}`;
}
function adminTabContent(){
 if(adminTab==="kpis"){
   const keys=[
     ["TEAM_CALL_GOAL","Team Call Goal"],["TEAM_CONVERSATION_GOAL","Team Conversation Goal"],["TEAM_QUALIFIED_GOAL","Team Qualified Opportunity Goal"],["TEAM_ENROLLMENT_GOAL","Team Enrollment Goal"],
     ["REP_CALL_GOAL","Rep Call Goal"],["REP_CONVERSATION_GOAL","Rep Conversation Goal"],["REP_QUALIFIED_GOAL","Rep Qualified Goal"],["REP_ENROLLMENT_GOAL","Rep Enrollment Goal"]
   ];
   return `<section class="card"><div class="card-head blueh">EDIT KPI TARGETS</div><div class="card-body form">${keys.map(k=>`<label>${k[1]}<input data-setting="${k[0]}" type="number" value="${esc(state.settings[k[0]]??0)}"></label>`).join("")}<button class="btn primary" data-action="save-kpis">Save KPI Settings</button></div></section>`;
 }
 if(adminTab==="commissions"){
   return `<section class="card"><div class="card-head greenh">COMMISSIONS AND CLIENT FEES</div><div class="card-body table-wrap"><table class="data"><thead><tr><th>Service</th><th>Commission</th><th>Client Fee</th><th>Active</th></tr></thead><tbody>
   ${state.commissionRules.map((r,i)=>`<tr><td><input data-cr="${i}" data-field="service" value="${esc(r.service)}"></td><td><input data-cr="${i}" data-field="commission" type="number" step=".01" value="${r.commission}"></td><td><input data-cr="${i}" data-field="fee" type="number" step=".01" value="${r.fee}"></td><td><select data-cr="${i}" data-field="active"><option value="TRUE" ${r.active?"selected":""}>TRUE</option><option value="FALSE" ${!r.active?"selected":""}>FALSE</option></select></td></tr>`).join("")}
   </tbody></table><button class="btn green" data-action="save-commissions" style="margin-top:10px">Save Commission/Fee Rules</button></div></section>`;
 }
 if(adminTab==="content"){
   return `<div class="grid2"><section class="card"><div class="card-head greenh">MISSION CONTENT</div><div class="card-body">${state.mission.map((m,i)=>`<div style="padding:10px 0;border-bottom:1px solid var(--line)"><b>${esc(m.title)}</b><button class="btn ghost" data-edit-mission="${i}" style="float:right">Edit</button><div class="tiny">${esc(m.definition)}</div></div>`).join("")}</div></section>${trustCard()}</div>`;
 }
 return `<section class="card"><div class="card-head blueh">WEEKLY RECOGNITION</div><div class="card-body form">${["TOP_PRODUCER","MOST_IMPROVED","BEST_CALL_QUALITY","TEAM_PLAYER"].map(k=>`<label>${k.replaceAll("_"," ")}<input data-rec="${k}" value="${esc(state.recognition?.[k]||"")}"></label>`).join("")}<button class="btn primary" data-action="save-recognition">Save Recognition</button></div></section>`;
}

function superAdminView(){
 if(session.role!=="SuperAdmin") return `<div class="permission-note">Super Admin access required.</div>`;
 const tabs=[["reps","Sales Reps"],["admins","Admins"],["system","System Controls"]];
 return `<h2 class="section-title">Super Admin Backend</h2><div class="tabs">${tabs.map(t=>`<button data-super-tab="${t[0]}" class="${superTab===t[0]?"active":""}">${t[1]}</button>`).join("")}</div>${superTabContent()}`;
}
function superTabContent(){
 if(superTab==="reps"){
   return `<section class="card"><div class="card-head blueh">REP MANAGEMENT</div><div class="card-body table-wrap"><table class="data"><thead><tr><th>RepID</th><th>Name</th><th>Active</th><th>Date Added</th><th>Reset PIN</th></tr></thead><tbody>
   ${state.repsAdmin.map(r=>`<tr><td>${esc(r.id)}</td><td><input data-rep-id="${esc(r.id)}" data-rfield="name" value="${esc(r.name)}"></td><td><select data-rep-id="${esc(r.id)}" data-rfield="active"><option value="TRUE" ${r.active?"selected":""}>TRUE</option><option value="FALSE" ${!r.active?"selected":""}>FALSE</option></select></td><td>${esc(r.dateAdded||"")}</td><td><input data-rep-id="${esc(r.id)}" data-rfield="pin" placeholder="new PIN"></td></tr>`).join("")}
   </tbody></table><button class="btn primary" data-action="save-reps" style="margin-top:10px">Save Rep Changes</button></div></section>`;
 }
 if(superTab==="admins"){
   return `<section class="card"><div class="card-head purpleh">ADMIN MANAGEMENT</div><div class="card-body table-wrap"><table class="data"><thead><tr><th>AdminID</th><th>Name</th><th>Role</th><th>Active</th><th>Reset PIN</th></tr></thead><tbody>
   ${state.adminsAdmin.map(a=>`<tr><td>${esc(a.id)}</td><td><input data-admin-id="${esc(a.id)}" data-afield="name" value="${esc(a.name)}"></td><td><select data-admin-id="${esc(a.id)}" data-afield="role"><option ${a.role==="Admin"?"selected":""}>Admin</option><option ${a.role==="SuperAdmin"?"selected":""}>SuperAdmin</option></select></td><td><select data-admin-id="${esc(a.id)}" data-afield="active"><option value="TRUE" ${a.active?"selected":""}>TRUE</option><option value="FALSE" ${!a.active?"selected":""}>FALSE</option></select></td><td><input data-admin-id="${esc(a.id)}" data-afield="pin" placeholder="new PIN"></td></tr>`).join("")}
   </tbody></table><button class="btn primary" data-action="save-admins" style="margin-top:10px">Save Admin Changes</button></div></section>`;
 }
 return `<section class="card"><div class="card-head redh">SYSTEM CONTROLS</div><div class="card-body"><div class="permission-note"><b>Super Admin only.</b><br>Use this level for administrator accounts, rep access, role assignment, PIN resets, and global configuration. Admin users can manage operating KPIs, commissions, fees, coaching content, and recognition but cannot create/elevate Super Admin access.</div></div></section>`;
}

function render(){
 if(!state)return;
 $("#dateText").textContent=new Date($("#workDate").value+"T12:00:00").toLocaleDateString(undefined,{weekday:"long",year:"numeric",month:"long",day:"numeric"});
 const c=$("#content");
 c.innerHTML=view==="dashboard"?dashboardView():view==="scoreboard"?scoreboardView():view==="activity"?activityView():view==="mission"?missionView():view==="commission"?commissionView():view==="admin"?adminView():superAdminView();
 bind();
}
function bind(){
 document.querySelectorAll("[data-mission]").forEach(b=>b.onclick=()=>openMission(+b.dataset.mission));
 document.querySelectorAll("[data-admin-tab]").forEach(b=>b.onclick=()=>{adminTab=b.dataset.adminTab;render()});
 document.querySelectorAll("[data-super-tab]").forEach(b=>b.onclick=()=>{superTab=b.dataset.superTab;render()});
 document.querySelector("[data-action=save-activity]")?.addEventListener("click",saveActivity);
 document.querySelectorAll("[data-action=edit-trust]").forEach(b=>b.onclick=editTrust);
 document.querySelectorAll("[data-edit-mission]").forEach(b=>b.onclick=()=>editMission(+b.dataset.editMission));
 document.querySelector("[data-action=save-kpis]")?.addEventListener("click",saveKpis);
 document.querySelector("[data-action=save-commissions]")?.addEventListener("click",saveCommissions);
 document.querySelector("[data-action=save-recognition]")?.addEventListener("click",saveRecognition);
 document.querySelector("[data-action=save-reps]")?.addEventListener("click",saveReps);
 document.querySelector("[data-action=save-admins]")?.addEventListener("click",saveAdmins);
}
function openMission(i){
 const m=state.mission[i];$("#modalBody").innerHTML=`<div class="dialog-in"><h2>${esc(m.title)}</h2><h4>Sales meaning</h4><p>${esc(m.definition)}</p><h4>Talk Track</h4><p><b>${esc(m.talkTrack)}</b></p><h4>Coaching Points</h4><ul>${m.points.map(p=>`<li>${esc(p)}</li>`).join("")}</ul></div>`;$("#modal").showModal();
}
async function saveActivity(){try{await gas("addActivity",{activity:{employeeId:$("#actRep").value,eventType:$("#actType").value,quantity:+$("#actQty").value||1,date:$("#workDate").value}});toast("Activity saved");await loadDashboard()}catch(e){toast(e.message)}}
async function editTrust(){
 const headline=prompt("Headline",state.trust.headline);if(headline===null)return;const subheadline=prompt("Subheadline",state.trust.subheadline||"EARN THE CLIENT'S TRUST.");if(subheadline===null)return;const body=prompt("Message",state.trust.body);if(body===null)return;
 try{await gas("updateTrust",{content:{headline,subheadline,body}});toast("Message updated");await loadDashboard()}catch(e){toast(e.message)}
}
async function editMission(i){
 const m=state.mission[i];
 const definition=prompt("Sales meaning",m.definition);
 if(definition===null)return;
 const talkTrack=prompt("Talk track",m.talkTrack);
 if(talkTrack===null)return;
 try{await gas("updateMission",{key:m.key,content:{definition,talkTrack,points:m.points}});toast("Mission updated");await loadDashboard()}catch(e){toast(e.message)}
}
async function saveKpis(){
 const settings={};document.querySelectorAll("[data-setting]").forEach(i=>settings[i.dataset.setting]=i.value);
 try{await gas("saveSettings",{settings});toast("KPI settings saved");await loadDashboard()}catch(e){toast(e.message)}
}
async function saveCommissions(){
 const rows=state.commissionRules.map((r,i)=>({service:document.querySelector(`[data-cr="${i}"][data-field="service"]`).value,commission:+document.querySelector(`[data-cr="${i}"][data-field="commission"]`).value||0,fee:+document.querySelector(`[data-cr="${i}"][data-field="fee"]`).value||0,active:document.querySelector(`[data-cr="${i}"][data-field="active"]`).value==="TRUE"}));
 try{await gas("saveCommissionRules",{rows});toast("Commission and fee rules saved");await loadDashboard()}catch(e){toast(e.message)}
}
async function saveRecognition(){
 const values={};document.querySelectorAll("[data-rec]").forEach(i=>values[i.dataset.rec]=i.value);
 try{await gas("saveRecognition",{values});toast("Recognition saved");await loadDashboard()}catch(e){toast(e.message)}
}
async function saveReps(){
 const by={};document.querySelectorAll("[data-rep-id]").forEach(i=>{const id=i.dataset.repId;(by[id]??={id})[i.dataset.rfield]=i.value});
 try{await gas("saveReps",{rows:Object.values(by)});toast("Rep records saved");await loadDashboard()}catch(e){toast(e.message)}
}
async function saveAdmins(){
 const by={};document.querySelectorAll("[data-admin-id]").forEach(i=>{const id=i.dataset.adminId;(by[id]??={id})[i.dataset.afield]=i.value});
 try{await gas("saveAdmins",{rows:Object.values(by)});toast("Admin records saved");await loadDashboard()}catch(e){toast(e.message)}
}

function updateLoginIdLabel(){
  $("#idLabel").textContent=$("#loginRole").value==="SalesRep"?"Rep ID (200-250)":"Admin ID";
  $("#loginId").placeholder=$("#loginRole").value==="SalesRep"?"e.g. 201":"e.g. SA2";
}
$("#loginRole").addEventListener("change",updateLoginIdLabel);
updateLoginIdLabel();
$("#loginForm").addEventListener("submit",login);
$("#logoutBtn").addEventListener("click",logout);
$("#refreshBtn").addEventListener("click",loadDashboard);
$("#workDate").value=new Date().toISOString().slice(0,10);
$("#workDate").addEventListener("change",loadDashboard);
document.querySelectorAll("#mainNav button").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll("#mainNav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");view=b.dataset.view;render()}));

(async function boot(){
 if(session){
   $("#loginPage").classList.add("hidden");$("#appShell").classList.remove("hidden");setRoleUI();
   try{await loadDashboard()}catch(e){logout()}
 }
})();
</script>
</body>
</html>
